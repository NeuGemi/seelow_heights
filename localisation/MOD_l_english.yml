### Events ###
intro.1.t:0 "Final Days of the Reich"
intro.1.d:0 "The end of the war is near.\n\nThe Red Army's stunning success of the Vistula-Oder Offensive has laid the groundworks for an inevitable assault on Berlin. The defense of Berlin is now in the hands of a motley force of Hitlerjugend, Volkssturm units and the depleted 9th Army.\n\nMeanwhile, in the west, Allied forces continue to advance deeper into German territory and have managed to encircle Walter Model's Army Group B in the heart of Germany's industrial region. The Western Front now consists of Kampfgruppe's and depleted divisions, some existing only on paper."
intro.1.a:0 "So it begins..."
intro.2.t:0 "The Setting Sun"
intro.2.d:0 "After a near decade of war, the once mighty Empire of the Rising Sun faces mounting pressure as the war draws ever closer to the mainland. Their fleet has been reduced to rubble, its armies weakened and with US naval landings on Iwo Jima, Okinawa and the Philippines, they find themselves more and more cornered. \n\nHowever, with Operation Ichi-Go a success, will they end the war in China before the US reaches Tokyo? Will they push back the Tenth Army at Okinawa?"
intro.2.a:0 "So it begins..."
scenario.1.t:0 "Surrender of Army Group B"
scenario.1.d:0 ""
scenario.1.a:0 ""
scenario.2.t:0 "Himmler's Betrayal"
scenario.2.d:0 "The treacherous Heinrich Himmler have secretly attempted to sue for a separate peace with the Allied forces! \n\nHimmler has in the midst of chaos arranged negotiations with Count Folke Bernadotte, using his masseur, Felix Kersten as an intermediary. With an arrest of Himmler ordered by Hitler and the negotiations failed, he has since gone into hiding."
scenario.2.a:0 "Betrayal!"
scenario.3.t:0 "Fegelein's Execution"
scenario.3.d:0 "The deserting Hermann Fegelein, has been found by Reichssicherheitsdienst Peter Högl in his Berlin apartment preparing to flee to Sweden after refusing to participate in what he deems a 'suicide pact.' Fegelein has since his capture been tied as an accomplice to the betrayal of Himmler, and been promptly brought back to the Reichsbunker where he was sentenced to death."
scenario.3.a:0 "Fegelein! Fegelein! Fegelein!"
scenario.4.t:0 "Birth of the Flensburg Government"
scenario.4.d:0 "As the allied forces advance on all fronts, Admiral Karl Dönitz assumes the role as Führer following Hitler's suicide. Situated in Flensburg, the new government is tasked with insurmountable task of adminstrating the unoccupied territories of the Reich."
scenario.4.a:0 "A three week Reich."
scenario.5.t:0 "Adolf Hitler Commits Suicide!"
scenario.5.d:0 "The Führer, $GER_adolf_hitler$, has been found dead in his bunker. With enemy forces closing in, it seems the Führer decided to take his own life rather than risk capture. In order to prevent demoralization of the troops, our propaganda outlets are being briefed that Hitler died fighting heroically to his last breath in the face of overwhelming enemy forces. With the death of the Führer, Karl Dönitz assumes the role."
scenario.5.a:0 "The war is lost."
scenario.6.t:0 "Battle of Castle Itter"
scenario.6.d:0 "On the fifth of May, American armored tank battalions launched an attack on Castle Itter. French tennis star Borotra assisted the Allied attack by vaulting up the castle walls to deliver vital information of the enemies positions. This day marks one of the strangest battles of the entire war, and will surely be a story to tell for decades to come."
scenario.6.a:0 "Cowards!"

scenario.8.t:0 "Army Group Courland Evacuates!"
scenario.8.d:0 "Army Group Courland, being isolated in the Courland Peninsula since the Red Army's Baltic Offensive in 1944, has been ordered to evacuate by sea. A successful evacuation can only mean a stabilisation of fronts in mainland Europe."
scenario.8.a:0 "Order the Kriegsmarine to assist."

scenarionews.1.t:0 "Fall of Vienna"
scenarionews.1.d:0 "The City of Vienna, under the Nazi control for the past decade has been liberated by Soviet forces, this comes after a period of extensive urban siege due to the ad-hoc formations to stove off capture by the Red Army. This is a major blow to the Nazi war effort and will surely thin their morale even harder, Europe waits teetered for whatever good may come next..."
scenarionews.1.a:0 "This is a major victory in the anti-Nazi war effort and will surely symbolise the end of Germany's rampage."
scenarionews.1.b:0 "For Endsieg is still to come, we must not fret over isolated defeats!"
scenarionews.2.t:0 "Battle of Berlin"
scenarionews.2.d:0 "Heavy fighting has been declared across the entire stretch of the Oder-Neisse River as the Soviets are mounting a final offensive to crush Germany and capture the nation's heartland- Berlin. \n\nThe Soviets have started off massive artillery raids across the river line while the Germans themselves have formed ad-hoc defenses and gathered everything possible to hold off the Red Army. \n\nDue to fog of war, not much is known, but combined attacks are being declared alongside major fighting at the Seelow Heights region where Soviet troops have bridgeheads across the Oder river just west of Küstrin."
scenarionews.2.a:0 "Peace in Europe is near, we pray that the Soviets succeed in their quest."
scenarionews.2.b:0 "Let them come."
scenarionews.3.t:0 "Mussolini Captured and Executed"
scenarionews.3.d:0 "In the late hours of April 27th, Mussolini and his wife were captured by partisans while attempting to cross the Swiss border. Mussolini has reportedly been killed and his body is triumphantly being displayed in a public square in Milan. \n\nDoes this spell the end of fascism in Italy?"
scenarionews.3.a:0 "That's the end of his war."
