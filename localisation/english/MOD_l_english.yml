### Bookmarks ###
SEELOW_NAME:0 "Battle of the Seelow Heights"
SEELOW_DESC:0 "World War II is coming to an end. The Wehrmacht is defeated, retreating on all fronts as the Allied and Soviet onslaught continues. The Allies rush towards the Elbe River, while the Red Army shells Berlin. Losing on every front, Goebbels calls for a total war and a final victory, to no avail. \nIn the Pacific, the disastrous Operation Ten-Go has crippled Japan's once-mighty fleet. US naval landings on Iwo Jima, Okinawa, and the Philippines have further cornered them."
BERLIN_DESC:0 "In only a matter of days, the Red Army has encircled Berlin and enveloped, destroyed, or trapped several armies of the Wehrmacht. Mass disarray ensues as parts of the 9th Army is trapped in the Halbe pocket, Berlin and some remnants in the Sudeten Area. \nThe mass surrender of armies in the Western Front means the Allied forces advance unopposed through Southern Germany and Italy, while the Red Army pushes towards and past Brno and Croatia."
BERLIN_NAME:0 "The Battle of Berlin"
SPRINGAWAKENING_NAME:0 "Operation Spring Awakening"
SPRINGAWAKENING_DESC:0 "Following the failed Ardennes offensive, Hitler has called for a major offensive in Hungary with the aim of securing the vital oil fields in the area and stalling an inevitable Red Army offensive towards Vienna.\n\nWithdrawing the 6. SS Panzerarmee from OB WEST and inserting it inbetween the 2. Panzerarmee and the 6. Armee in the east, and after major delays, the last offensive of Germany, operation Spring Awakening is set to commence."
WHENTITANSCLASHED_NAME:0 "Vistula-Oder Offensive"
WHENTITANSCLASHED_DESC:0 "The Red Army are poised to launch a series of major offensive along German occupied Poland. German intelligence falsely estimates being outnumbered 3:1. They are instead outnumbered 5:1. \n\nA last major push from both West and the East only remains for an unconditional surrender of Germany. The end is near, and an ambitious last German 'Blitzkrieg' offensive codenamed 'Unternehmen Wacht Am Rhein', has failed."
GER_SEELOW_DESC:0 "Germany is nothing but rubble, the once mighty German army replaced by the inexperienced young and elderly. The end of the war is being signalled as Germany sits on its knees while the Allies spear towards the Elbe from the west while the Soviets are preparing for the final showdown from the East, Vienna is already within their grasp. Hitler rants and rages while awaiting for the victory that he so much hopes to achieve."
ITA_SEELOW_DESC:0 "When Operation Husky launched in 1943, the Kingdom of Italy fractured into a civil war, with Regno del Sud being under control by AMGOT and the Italian Social Republic under control by the German Reich.\n\nThe campaign in Italy have been long and brutal, barely moving for the past years. However a new Allied offensive - Operation Grapeshot, is being prepared. Will it bring an end to Nazi control in Northen Italy?"
CRO_SEELOW_DESC:0 "Installed in 1941 as a puppet state of Germany after Operation 25, Croatia would find itself on the main line of the eastern front from 1944.\n\nFighting bitterly to the end, they surrendered its armed forces on May 15, seven days after the German Reich."
HUN_SEELOW_DESC:0 "Since October 1944, Hungary has been under the dictatorship of Ferenc Szálasi, installed by Adolf Hitler following a coup. Since then, Budapest has found itself under siege, doomed and littered by panzers sent to relieve the city.\n\nWith Hungary now almost in the Soviets grasp and the imminent fall of Budapest, any sign of victory has been long since washed away."
SLO_SEELOW_DESC:0 ""
JAP_SEELOW_DESC:0 "After a near decade of war, the once mighty Empire of the Rising Sun faces mounting pressure as the war draws ever closer to the mainland. Their fleet has been reduced to rubble, its armies weakened and with US naval landings on Iwo Jima, Okinawa and the Philippines, they find themselves more and more cornered. \n\nHowever, with Operation Ichi-Go a success, will they end the war in China before the US reaches Tokyo? Will they push back the Tenth Army at Okinawa?"
MAN_SEELOW_DESC:0 ""
MEN_SEELOW_DESC:0 ""
SIA_SEELOW_DESC:0 ""


