### Ideas ###
surrender_limit:0 "Endsieg"
GER_totalen_krieg_doctrine:0 "Totalen Krieg"
GER_shattered_wehrmacht:0 "A Shattered Wehrmacht"
GER_shattered_wehrmacht_desc:0 "After 6 years of uninterrupted combat, the Wehrmacht is finally on its knees. What was once the most feared army in the world has been turned into a mere phantom skeleton of itself. The regime has turned to ad-hoc formations to defend the last remaining inches of the "Fatherland" while commanders are stuck overseas or across the frontlines, in the Cour and at the spits of Konigsberg... Disparate formations have taken precedence and even the most regular units lack basic equipment needed to perform in extensive combat against the raging Soviet & Allied forces closing in on both sides.\n\nBut not all is lost according to the "Fuhrer" and Propaganda Minister Joseph Goebbels, of which is calling for "Endsieg" or otherwise known as "Final Victory" in the clash of the war. With the announced death of Franklin D. Roosevelt, Hitler believes victory is all but assured..."
JAP_shattered_army:0 "The Setting Sun"
JAP_economic_collapse:0 "Terror Bombing Devastation"
GER_economic_collapse:0 "Allied Bombing Raids" 
GER_endsiegmod:0 "Endsieg"
GER_endsiegmod_tt:0 "\n§YShould the Führer suicide, it's unlikely the war would continue for much longer§!"
GER_scenariointro_tt:0 "§YOption to remove debuffs can be found in the Decisions tab§!"
GER_scenario_volkssturm:0 "Volkssturm"
GER_scenario_volkssturm_desc:0 "The Volkssturm is an ad-hoc armed civilian formation pushed forth by Plenipotentiary for "Total War" Joseph Goebbels. He has been a harsh advocate for using all the necessary resources of the nation to prevent the "Bolshevik" "hordes" from consuming Germany in its entirety and his strategy has been focused on slowing the advance of the Soviets... By conscripting every day civilians. Whether it be the young, or the old, or the physically incapable, the conscription campaigns have left no corners of escape for those fleeing from war. These formations in its entirety are usually poorly equipped and by extension, untrained. They're used as fodder for the frontlines and for the "final showdown" in Berlin with the hope of creating the material conditions of victory..."
GER_renewed_wehrmacht:0 "The Wehrmacht"
GER_disloyalty:0 "Mass Disloyalty"
GER_disloyalty_desc:0 "Germany sits on the brink of collapse as soldiers are refusing basic combat against the Allies, the west is all but defensible as Model's 15th Army in Cologne is dissolving at the second with rumours of rebellion by the commander, allegedly preparing orders for his men to stand down and surrender. On that topic, German commanders across the entire Reich have "betrayed" and "refused" orders from the "Fuhrer", enraging him as Hitler goes into desperate rants about how "he was betrayed by those around him" and that he himself had been responsible for the conquest of Europe...\n\nFor others, the Soviets and Allies, morning is rising over Europe as any semblance of Wehrmacht morale sinks like quicksand, if this issue is not resolved then there will be no Reich left to defend."
GER_economic_collapse_tt:0 "§Y\nWill be removed when Surrender Progress is below 1%§!"
SOV_berlin_strategic_offensive_operation:0 "Berlin Strategic Offensive Operation"
