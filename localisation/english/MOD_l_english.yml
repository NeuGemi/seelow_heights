# Volkssturm Events #
volkssturm.1.t:0 "Volkssturm Militias Raised in Vienna"
volkssturm.1.d:0 "Volkssturm militias have been raised, comprising of every day civilians deemed too old, young or unfit to fight as a final component of the 'Total War' promulgated by Propaganda Minister Joseph Goebbels."
volkssturm.1.a:0 "Endsieg is near."
volkssturm.2.t:0 "Volkssturm Militias Raised in Munich"
volkssturm.3.t:0 "Volkssturm Militias Raised in Frankfurt"
volkssturm.4.t:0 "Volkssturm Militias Raised in Hamburg"
volkssturm.5.t:0 "Volkssturm Militias Raised in Prague"
volkssturm.6.t:0 "Volkssturm Militias Raised in Berlin"

### Decisions ###
GER_oberkommando:0 "Oberkommando Des Heeres"
GER_oberkommando_desc:0 "After 6 years of war, the Wehrmacht is defeated, retreating. Losing on every front, Goebbels calls for a total war, with Volkssturm militias, wunderwaffen and victory through force of will. However as the Allies gain ground each day, and the Red Army prepares for a final offensive, the grasp of victory is far away. It only remains to be seen whether or not Goebbels speeches of a final victory is to be seen."
GER_hold_holland:0 "Festung Holland"
GER_hold_holland_desc:0 "Around 150 000 German soldiers of the Oberbefehlshaber Niederlande are destined to hold the Netherlands, cutting off vital supplies from the enemy aswell as diverting reinforcements from the allied 12th and 21st Army Group."
GER_hold_berlin:0 "Hold Berlin!"
GER_hold_berlin_desc:0 "All intelligence from the front suggests the Red Army will commence an assault to Berlin in the nearest future. Army Group Centre and Vistula have been ordered to defend Berlin and must hold it at all costs. "
GER_hold_vienna:0 "Vienna Offensive"
GER_hold_vienna_desc:0 "The II SS. Panzerkorps of the 6. SS Panzerarmee is tasked with the desperate defense of Vienna. They lack equipment, and without it, the city is doomed to fall without any further reinforcements. Vienna must remain ours!"
GER_hold_stuttgart:0 "Battle of Heilbronn"
GER_hold_stuttgart_desc:0 "Heilbronn, just west to Stuttgart, is set to fall within hours! Hindering Heilbronn from Allied control will slow their advance into Stuttgart and Munich, and must therefore be held at all costs."
GER_hold_italy:0 "Operation Grapeshot"
GER_hold_italy_desc:0 "The Allies have launched a final attack in Italy codenamed 'Operation Grapeshot'. Halting this offensive is of outmost importance to stop eventual Allied advancements into Austria and Italy."
GER_hold_munich:0 "Defend Munich!"
GER_hold_munich_desc:0 "The ruins of the city of Munich makes for an excellent fallback line to regroup and organize a counterattack. For this reason, Munich cannot fall to the enemy hands."
GER_operation_hannibal:0 "Operation Hannibal"
GER_operation_hannibal_desc:0 "Operation Hannibal, an evacuation by sea of German troops and civilians from Prussia and the Courland Pocket is currently underway."
GER_ruhr_pocket:0 "The Ruhr Pocket"
GER_ruhr_pocket_desc:0 "Heeresgruppe B has been encircled in the Ruhr valley. With it being the bulk of our forces in the West, it is of outmost importance for a breakout. \n\nHitler, however, has other plans for Heeresgruppe B; he is expecting 'Festung Ruhr' to hold out for months and tie out hundreds of thousands of Allied troops."
GER_hold_warschau:0 "Hold Warsaw!"
GER_hold_warschau_desc:0 "'Festung Warschau' - as deemed so by Hitler, shall not fall, and mustn't fall. It has remained ours for six years and will do so for six more years!"
GER_hold_budapest:0 "Siege of Budapest"
GER_hold_budapest_desc:0 "Since December 1944, 100 000 soldiers have been encircled in Budapest. Various relief operations have been attempted or are underway.\n\nShould Budapest fall, Hungary will fall."
GER_operation_solstice_decision:0 "Operation Solstice"
GER_wacht_am_rhein:0 "Wacht am Rhein"
GER_wacht_am_rhein_desc:0 "Our offensive in the west has bogged down. Any outcome that isn't a complete success will lead to the eventual defeat of the German Reich. It is therefore of outmost importance that Wacht am Rein succeeds"
GER_operation_nordwind:0 "Operation Nordwind"
GER_operation_nordwind_desc:0 "Operation Wacht am Rhein has stalled. For it to succeed, we must divert Allied forces away from Belgium and destroy any forces in our way."
GER_hold_vienna_keep_buffs:0 "Hold Vienna to keep buffs!"
GER_defense_of_berlin_preparations:0 "Defensive Preparations for the Battle of Berlin"
GER_defense_of_berlin_preparations_desc:0 "The Battle of Berlin is an inevitable fact...defensive preparations of all kind must be undertaken to ensure it will not fall into the hands of Churchill or Stalin. Men from the Reichsarbeitsdienst, Hitlerjugend and Volkssturm will be employed in the action of the defense, leading to nothing else but complete victory."
GER_form_12th_army:0 "Form Reichsarbeitsdienst Divisions"
GER_conscript_volkssturm_in_berlin:0 "Formation of the Berlin Garnison"
GER_mass_defense_improvisation:0 "Mass-Improvised Defensive Preparations"
GER_12th_army_tt:0 "§YRAD-Divisions I-IV will be formed§!"
GER_defense_of_berlin_tt:0 "§YBerlin Garnison, comprising of Volkssturm and Hitlerjugend will be formed§!"

JAP_hold_territory:0 "Imperial Supreme War Command"
JAP_operation_ten_go:0 "Operation Ten-Go"
JAP_operation_ten_go_desc:0 "We must launch a kamikaze attack against the US navy stationed offshore Okinawa, by Yamato and her escort ships. For the tradition and the glory of the Navy!"
JAP_operation_sho_go:0 "Operation Sho-Go II"
JAP_operation_sho_go_desc:0 "Our defensive operations of an eventual battle of Okinawa has proven to not be for naught. It is now time to set it in motion."
JAP_operation_meigo_sakusen:0 "Operation Sakusen"
JAP_operation_meigo_sakusen_desc:0 "The threat of an Allied invasion into Indochina is too great to simply remain idle, while the French still house thousands of Tirailleurs and colonial troops in Indochina - something we've allowed so far, we must prevent them to rise up when the time comes."

JAP_asiatic_land_war:0 "Asia–Pacific War"
JAP_asiatic_land_war_desc:0 "The Japanese dominance over asia is coming to an end. The swift gains made by Japan in the earlier years are being slowly undone by a combined Allied effort, and it would seem now that the days of the Empire of the Sun are numbered. Realising this, the Imperial Command are relying on decisive victories and a bloody war of attrition in their favor. The question is though, will it be enough for a fragile peace?"
JAP_allied_invasion_of_borneo:0 "Allied Invasion of Borneo"
JAP_allied_invasion_of_borneo_desc:0 "Borneo is a vital base of operations for us, and likewise for the Allies. As it has stood uncontested since our conquest, so it shall remain."
JAP_hold_burma:0 "The Race for Rangoon"
JAP_hold_mandalay:0 "Hold Mandalay"
JAP_hold_phi:0 "Allied Liberation of the Philippines"
JAP_hold_okinawa:0 "Hold Okinawa"
JAP_hold_tokyo:0 "Operation Downfall"
JAP_hold_manchuria:0 "Reinforce The Kwantung Army!"
JAP_south_china_sea_air_raid:0 "South China Sea Air Raid"
JAP_south_china_sea_air_raid_desc:0 "The Americans have launched a massive air raid in support of their invasion of the Philippines!"
JAP_allied_chinese_support:0 "Allied-Chinese Logistical Support"
JAP_burma_road_closed:0 "The Burma Road (Closed)"
JAP_stilwell_road_opened:0 "The Stilwell Road (Open)"
JAP_burma_road_opened:0 "The Burma Road (Open)"
JAP_stilwell_road_closed:0 "The Stilwell Road (Closed)"
CHI_west_henan_north_hubei_offensive:0 "Henan-Hubei Counteroffensive"
CHI_west_henan_north_hubei_offensive_ongoing:0 "Battle of West Henan–North Hubei"
JAP_west_henan_north_hubei_offensive_ongoing_desc:0 "A Chinese counteroffensive has been launched in the area of Henan and Hubei!"
CHI_west_hunan_offensive:0 "West Hunan Counteroffensive"
CHI_west_hunan_offensive_ongoing:0 "Battle of West Hunan"
JAP_west_hunan_offensive_ongoing_desc:0 "A Chinese counteroffensive has been launched in the area of Changsha!"
CHI_second_guanxi_offensive:0 "Second Guangxi Campaign"
CHI_second_guanxi_offensive_ongoing:0 "Second Battle of Guangxi"
CHI_second_guanxi_offensive_ongoing_desc:0 "A Chinese counteroffensive has been launched in the area of Guangxi!"
JAP_second_guanxi_offensive_ongoing_desc:0 "A Chinese counteroffensive has been launched in the area of Guangxi!"
JAP_conquer_chongqing:0 "Seize Chongqing!"

JAP_operation_ketsugo_cat:0 "Operation Ketsu-Go"
JAP_operation_ketsugo_cat_desc:0 "The catastrophic defeats inflicted upon our navy means the Allies now possess an open pathway to the heart of Japan. To counter this, Operation Ketsugo hasa been devised - a final, decisive battle over our Inner Lands. Fortifications, militias and superiority of will shall make their invasion as costly as possible."
JAP_operation_ketsu_go:0 "Operation Ketsu-Go"
JAP_operation_ketsu_go_desc:0 "Our lands are breached! Let every man, woman and child be employed in the defense of [JAP.GetNameDef] and our holy emperor!"
JAP_the_glorious_death_of_one_million:0 "The Glorious Death of One Hundred Million"
JAP_the_glorious_death_of_one_million_desc:0 "The... entire population is to be involved in the defense of our inner lands. Our resolve shall prove the suffering of this invasion."
JAP_evacuate_the_ighq_underground:0 "Evacuate the IGHQ Underground"
JAP_evacuate_the_ighq_underground_desc:0 "Three mountains have been carved out to function as a secure base of operations in the event of an invasion. Impenetrable by bombs, numerous tunnels link the facilites of the three mountains together."
JAP_fortify_kyushu:0 "Secure Kyushu Beachheads"
JAP_fortify_kyushu_desc:0 "It is clear to us that the probable area of an Allied attack is Kyushu. A series of bunkers along the shores will force them to rethink..."
JAP_fortify_tokyo:0 "Fortify Tokyo Beaches"
JAP_establish_the_vfc_decision:0 "The Volunteer Fighting Corps"
