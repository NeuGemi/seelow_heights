### Events ###
intro.1.t:0 "Final Days of the Reich"
intro.1.d:0 "The end of the war is near.\n\nThe Red Army's stunning success of the Vistula-Oder Offensive has laid the groundworks for an inevitable assault on Berlin. The defense of Berlin is now in the hands of a motley force of Hitlerjugend, Volkssturm units and the depleted 9th Army.\n\nMeanwhile, in the west, Allied forces continue to advance deeper into German territory and have managed to encircle Walter Model's Army Group B in the heart of Germany's industrial region. The Western Front now consists of Kampfgruppe's and depleted divisions, some existing only on paper."
intro.1.a:0 "So it begins..."
intro.2.t:0 "The Setting Sun"
intro.2.d:0 "After a near decade of war, the once mighty Empire of the Rising Sun faces mounting pressure as the war draws ever closer to the mainland. Their fleet has been reduced to rubble, its armies weakened and with US naval landings on Iwo Jima, Okinawa and the Philippines, they find themselves more and more cornered. \n\nHowever, with Operation Ichi-Go a success, will they end the war in China before the US reaches Tokyo? Will they push back the Tenth Army at Okinawa?"
intro.2.a:0 "So it begins..."
intro.3.t:0 "The Battle of Berlin"
intro.3.d:0 "The Red Army's advance into Berlin has been swift and catastrophic for the Wehrmacht. \n\nIn only a matter of days, the Red Army has encircled Berlin and enveloped, destroyed, or trapped several armies of the Wehrmacht. Mass disarray ensues as parts of the 9th Army is trapped in the Halbe pocket, Berlin and some remnants in the Sudeten Area. \n\nThe mass surrender of armies in the Western Front means the Allied forces advance unopposed through Southern Germany and Italy, while the Red Army pushes towards and past Brno and Croatia."
intro.3.a:0 "So it ends..."
intro.4.t:0 "Germany in Ruin"
intro.4.d:0 "Following the failed Ardennes offensive, Hitler has called for a major offensive in Hungary with the aim of securing the vital oil fields in the area and stalling an inevitable Red Army offensive towards Vienna.\n\nWithdrawing the 6. SS Panzerarmee from OB WEST and inserting it inbetween the 2. Panzerarmee and the 6. Armee in the east, and after major delays, the last offensive of Germany, operation Spring Awakening is set to commence."
intro.4.a:0 "So it begins..."
scenario.1.t:0 "Heeresgruppe B surrenders!"
scenario.1.d:0 "Feldmarschall Walter Model has radioed the apparent surrender of the encircled Heeresgruppe B in the Ruhr Pocket after two weeks of fanatic fighting. Early reports have come in stating the suicide of Model following this defeat. \n\nPropaganda Minister Joseph Goebbels have publicly denounced Heeresgruppe B as traitors to the Reich."
scenario.1.a:0 "Traitors!"
scenario.2.t:0 "Himmler's Betrayal"
scenario.2.d:0 "The treacherous Heinrich Himmler have secretly attempted to sue for a separate peace with the Allied forces! \n\nHimmler has in the midst of chaos arranged negotiations with Count Folke Bernadotte, using his masseur, Felix Kersten as an intermediary. With an arrest of Himmler ordered by Hitler and the negotiations failed, he has since gone into hiding."
scenario.2.a:0 "Betrayal!"
scenario.3.t:0 "Fegelein's Execution"
scenario.3.d:0 "The deserting Hermann Fegelein, has been found by Reichssicherheitsdienst Peter Högl in his Berlin apartment preparing to flee to Sweden after refusing to participate in what he deems a 'suicide pact.' Fegelein has since his capture been tied as an accomplice to the betrayal of Himmler, and been promptly brought back to the Reichsbunker where he was sentenced to death."
scenario.3.a:0 "Fegelein! Fegelein! Fegelein!"
scenario.4.t:0 "Birth of the Flensburg Government"
scenario.4.d:0 "As the allied forces advance on all fronts, Admiral Karl Dönitz assumes the role as Führer following Hitler's suicide. Situated in Flensburg, the new government is tasked with insurmountable task of adminstrating the unoccupied territories of the Reich."
scenario.4.a:0 "A three week Reich."
scenario.5.t:0 "Adolf Hitler Commits Suicide!"
scenario.5.d:0 "The Führer, $GER_adolf_hitler$, has been found dead in his bunker. With enemy forces closing in, it seems the Führer decided to take his own life rather than risk capture. In order to prevent demoralization of the troops, our propaganda outlets are being briefed that Hitler died fighting heroically to his last breath in the face of overwhelming enemy forces. With the death of the Führer, Karl Dönitz assumes the role."
scenario.5.a:0 "The war is lost."
scenario.6.t:0 "Battle of Castle Itter"
scenario.6.d:0 "On the fifth of May, American armored tank battalions launched an attack on Castle Itter. French tennis star Borotra assisted the Allied attack by vaulting up the castle walls to deliver vital information of the enemies positions. This day marks one of the strangest battles of the entire war, and will surely be a story to tell for decades to come."
scenario.6.a:0 "Cowards!"
scenario.7.t:0 "Prague Uprising"
scenario.7.d:0 "Alarming news have reached the already crumbling Heeresgruppe Ostmark of an uprising in the city of Prague. Czech insurgents are reported to have already seized control of large parts of the city. \n\nSo far, only sporadic street fighting have occured between the heavily barricaded insurgents and locally stationed Waffen-SS soldiers."
scenario.7.a:0 "We will retake what is ours."
scenario.8.t:0 "Goebbels' Commits Suicide!"
scenario.8.d:0 "In the midst of fierce street to street fighting all over Berlin, Propaganda Minister Joseph Goebbels have committed suicide in the Führerbunker, following the death of Hitler. "
scenario.8.a:0 "Of little concern."
scenario.11.t:0 "Desertions"
scenario.11.d:0 "A disturbing rumor has been circulating around the 25. Armee of a soldier falsely pretending to be a Luftwaffe Hauptmann, bossing around, issuing orders and establishing an irregular band of soldiers behind him. \n\nHis journey of delinquency has so far involved reconnaisance missions, failed skirmishes and a peculiar encounter with a prison camp housing deserted Wehrmacht soldiers. \n\n'Hauptmann' Willi Herold's whereabouts are currently unknown"
scenario.11.a:0 "Deserters will be shot!"
scenario.12.t:0 "Der Führer's Birthday"
scenario.12.d:0 "Berlin is wrecked by unstoppable Allied strafing runs and the once mighty city is mere rubble. Hitler sits in the Führerbunker celebrating his birthday alongside Wehrmacht, Nazi and SS aides. \n\nThe future for the Reich seems bleak, but perhaps a final, decisive counterattack will roll over the Soviets? Uncertainty hangs in the air and Hitler has taken a stroll outside of his bunker, seeing all but the remains of wartorn buildings. "
scenario.12.a:0 "The sounds of bombings overshadow this day."
scenario.14.t:0 "Hitler visits the Front"
scenario.14.d:0 "The Führer, $GER_adolf_hitler$, on what would be his final visit to the front, has traveled to the 9th Army on the Oder. \n\nIn a meeting within the walls of Schloss Freienwalde, Hitler urged General Theodor Busse and his officers to hold back the advancing Red Army, long enough to deploy his new weapons."
scenario.14.a:0 "What are these new weapons he speaks of?"

scenarionews.1.t:0 "Fall of Vienna"
scenarionews.1.d:0 "The City of Vienna, under the Nazi control for the past decade has been liberated by Soviet forces, this comes after a period of extensive urban siege due to the ad-hoc formations to stove off capture by the Red Army. This is a major blow to the Nazi war effort and will surely thin their morale even harder, Europe waits teetered for whatever good may come next..."
scenarionews.1.a:0 "This is a major victory in the anti-Nazi war effort and will surely symbolise the end of Germany's rampage."
scenarionews.1.b:0 "For Endsieg is still to come, we must not fret over isolated defeats!"
scenarionews.2.t:0 "Battle of Berlin"
scenarionews.2.d:0 "Heavy fighting has been declared across the entire stretch of the Oder-Neisse River as the Soviets are mounting a final offensive to crush Germany and capture the nation's heartland- Berlin. \n\nThe Soviets have started off massive artillery raids across the river line while the Germans themselves have formed ad-hoc defenses and gathered everything possible to hold off the Red Army. \n\nDue to fog of war, not much is known, but combined attacks are being declared alongside major fighting at the Seelow Heights region where Soviet troops have bridgeheads across the Oder river just west of Küstrin."
scenarionews.2.a:0 "Peace in Europe is near, we pray that the Soviets succeed in their quest."
scenarionews.2.b:0 "Let them come."
scenarionews.3.t:0 "Mussolini Captured and Executed"
scenarionews.3.d:0 "In the late hours of April 27th, Mussolini and his wife were captured by partisans while attempting to cross the Swiss border. Mussolini has reportedly been killed and his body is triumphantly being displayed in a public square in Milan. \n\nDoes this spell the end of fascism in Italy?"
scenarionews.3.a:0 "That's the end of his war."
scenarionews.4.t:0 "Nazi defeat in the Ruhr"
scenarionews.4.d:0 "The bulk of German forces of the western front, Heeresgruppe B, has surrendered within the Ruhr Pocket - after weeks of fierce attritional warfare, akin to the encirclement and defeat of the German 6. Army in Stalingrad"
scenarionews.4.a:0 "Interesting."
scenarionews.4.b:0 "This is a disaster!"
scenarionews.5.t:0 "Magdeburg Liberated; Industrial Slave Camps Freed!"
scenarionews.5.d:0 "Today, U.S troops have liberated the city of Magdeburg on the right bank of the Elbe River just after a series of major fighting in the suburbs followed by heavy clashes in the center of the city where the measly German forces after a month of nonstop combat were pushed away. \n\nWhat remains to be seen is images of horror, the American troops have discovered industrial-level slave camps with many of them being actively freed as of yet. Another record of Nazi atrocity, the liberated are mourning the lost and local officials are preparing military administration."
scenarionews.5.a:0 "Europe comes one step closer to morning."
scenarionews.5.b:0 "The end is not near! Fight on!"
scenarionews.6.t:0 "Fall of The Italian Social Republic"
scenarionews.6.d:0 "The Italian Social Republic has fallen following the advancements of the Allied armies in Northern Italy. \n\nThe surrender of all German and Italian forces in Italy is under effect and will be a serious blow to the German war effort. The question now remains if the Allies will keep up their momentum. \n\nNow the Allied forces look to the north."
scenarionews.6.a:0 "Interesting."
scenarionews.6.b:0 "Traitors, defeatists!"  

### Decisions ###
GER_oberkommando:0 "Oberkommando Des Heeres"
GER_oberkommando_desc:0 "After 6 years of war, the Wehrmacht is defeated, retreating. Losing on every front, Goebbels calls for a total war, with Volkssturm militias, wunderwaffen and victory through force of will. However as the Allies gain ground each day, and the Red Army prepares for a final offensive, the grasp of victory is far away. It only remains to be seen whether or not Goebbels speeches of a final victory is to be seen."
GER_hold_holland:0 "Festung Holland"
GER_hold_holland_desc:0 "Around 150 000 German soldiers of the Oberbefehlshaber Niederlande are destined to hold the Netherlands, cutting off vital supplies from the enemy aswell as diverting reinforcements from the allied 12th and 21st Army Group."
GER_hold_berlin:0 "Hold Berlin!"
GER_hold_berlin_desc:0 "All intelligence from the front suggests the Red Army will commence an assault to Berlin in the nearest future. Army Group Centre and Vistula have been ordered to defend Berlin and must hold it at all costs. "
GER_hold_vienna:0 "Vienna Offensive"
GER_hold_vienna_desc:0 "The II SS. Panzerkorps of the 6. SS Panzerarmee is tasked with the desperate defense of Vienna. They lack equipment, and without it, the city is doomed to fall without any further reinforcements. Vienna must remain ours!"
GER_hold_stuttgart:0 "Battle of Heilbronn"
GER_hold_stuttgart_desc:0 "Heilbronn, just west to Stuttgart, is set to fall within hours! Hindering Heilbronn from Allied control will slow their advance into Stuttgart and Munich, and must therefore be held at all costs."
GER_hold_italy:0 "Operation Grapeshot"
GER_hold_italy_desc:0 "The Allies have launched a final attack in Italy codenamed 'Operation Grapeshot'. Halting this offensive is of outmost importance to stop eventual Allied advancements into Austria and Italy."
GER_hold_munich:0 "Defend Munich!"
GER_hold_munich_desc:0 "The ruins of the city of Munich makes for an excellent fallback line to regroup and organize a counterattack. For this reason, Munich cannot fall to the enemy hands."
GER_operation_hannibal:0 "Operation Hannibal"
GER_operation_hannibal_desc:0 "Operation Hannibal, an evacuation by sea of German troops and civilians from Prussia and the Courland Pocket is currently underway."
GER_ruhr_pocket:0 "The Ruhr Pocket"
GER_ruhr_pocket_desc:0 "Heeresgruppe B has been encircled in the Ruhr valley. With it being the bulk of our forces in the West, it is of outmost importance for a breakout. \n\nHitler, however, has other plans for Heeresgruppe B; he is expecting 'Festung Ruhr' to hold out for months and tie out hundreds of thousands of Allied troops."

