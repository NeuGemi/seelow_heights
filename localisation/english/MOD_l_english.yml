### Events ###
# Intro Events #
intro.1.t:0 "Final Days of the Reich"
intro.1.d:0 "The end of the war is near.\n\nThe Red Army's stunning success of the Vistula-Oder Offensive has laid the groundworks for an inevitable assault on Berlin. The defense of Berlin is now in the hands of a motley force of Hitlerjugend, Volkssturm units and the depleted 9th Army.\n\nMeanwhile, in the west, Allied forces continue to advance deeper into German territory and have managed to encircle Walter Model's Army Group B in the heart of Germany's industrial region. The Western Front now consists of Kampfgruppe's and depleted divisions, some existing only on paper."
intro.1.a:0 "So it begins..."
intro.2.t:0 "The Setting Sun"
intro.2.d:0 "After a near decade of war, the once mighty Empire of the Rising Sun faces mounting pressure as the war draws ever closer to the mainland. Their fleet has been reduced to rubble, its armies weakened and with US naval landings on Iwo Jima, Okinawa and the Philippines, they find themselves more and more cornered. \n\nHowever, with Operation Ichi-Go a success, will they end the war in China before the US reaches Tokyo? Will they push back the Tenth Army at Okinawa?"
intro.2.a:0 "So it begins..."
intro.3.t:0 "The Battle of Berlin"
intro.3.d:0 "The Red Army's advance into Berlin has been swift and catastrophic for the Wehrmacht. \n\nIn only a matter of days, the Red Army has encircled Berlin and enveloped, destroyed, or trapped several armies of the Wehrmacht. Mass disarray ensues as parts of the 9th Army is trapped in the Halbe pocket, Berlin and some remnants in the Sudeten Area. \n\nThe mass surrender of armies in the Western Front means the Allied forces advance unopposed through Southern Germany and Italy, while the Red Army pushes towards and past Brno and Croatia."
intro.3.a:0 "So it ends..."
intro.4.t:0 "Germany in Ruin"
intro.4.d:0 "Following the failed Ardennes offensive, Hitler has called for a major offensive in Hungary with the aim of securing the vital oil fields in the area and stalling an inevitable Red Army offensive towards Vienna.\n\nWithdrawing the 6. SS Panzerarmee from OB WEST and inserting it inbetween the 2. Panzerarmee and the 6. Armee in the east, and after major delays, the last offensive of Germany, operation Spring Awakening is set to commence."
intro.4.a:0 "So it begins..."
intro.5.t:0 "Prolonging Defeat"
intro.5.d:0 "The Axis are on their knees. \n\nThe Allies have consolidated their positions in the west. A last major push from both West and the East only remains for an unconditional surrender of Germany. The end is near, and an ambitious last German 'Blitzkrieg' offensive codenamed 'Unternehmen Wacht Am Rhein', has failed. \n\nIn the East, the extremely swift Soviet operation 'Bagration' managed to destroy 28 out of the 32 Divisions in Heeresgruppe Mitte. There also remains 35 German Divisions trapped in the 'Courland' Pocket. Now the Red Army is done preparing for another, last offensive in the likes of Bagration, but this time aiming for Berlin. \n\nIn Hungary, where a whole 40% of All German armoured forces are located, Budapest has been encircled and is under siege. Several desperate attempts to relieve them are well underway, doomed to fail."
intro.5.a:0 "So it begins..."
intro.5.b:0 "Tell me more"
intro.7.b:0 "Vistula-Oder Offensive"
intro.7.t:0 "Operations during 1945 in the Eastern Front."
intro.7.d:0 ""
intro.7.a:0 "Budapest Relief Attempts"
intro.7.c:0 "Operation Frühlingserwachen"
intro.8.t:0 "The Konrad Operations"
intro.8.d:0 "The attempts to relieve the trapped units in Budapest consisted of Operation Konrad I, Konrad II, and Konrad III. On January 1, Konrad I commenced. the IV SS Panzercorps advanced from Tata, but was quickly halted around 30km later, near Bicske. \n\nOn January 7, Konrad II commenced. The attack began with the III Panzercorps attacking Székesfehérvár to relieve pressure from the IV SS Panzercorps located this time in Esztergom (North of Budapest). Again led by the IV SS Panzercorps, advancing from Eztergom, they promptly halted their advance near Pilisszentkereszt due to the OKW fearing another encirclement. \n\nKonrad III, beginning on January 17 was the largest and most ambitious of the Konrad Operations. The IV SS Panzercorps had secretly relocated to Székesfehérvár, meeting up with the III Panzercorps. The attack was quite successful and took the Soviets by surprise. Elements managed to reach as far as the Danube, only 20km from Budapest. It reached it's peak on the 25th, but then failed due to a Soviet counteroffensive. \n\nWhat Hitler actually wanted to achieve with these operations are unclear. Either he wanted to reach Budapest just to reinforce the encircled garrison, in hopes of them fighting longer and further delaying Soviet Offensives, or he wanted to retake ground lost from previous Soviet Offensives, or actually rescue the trapped forces in Budapest."
intro.8.a:0 "Go Back"
intro.8.b:0 "I'm Done"
intro.9.t:0 "The Vistula-Oder Offensive"
intro.9.d:0 "The Vistula-Oder Offensive, being what this Scenario is centered around, began on January 12, with the goal of reaching Berlin. \n\nPrior to the invasion, the Red Army had accumulated large amounts of materiel and manpower. German intelligence were well aware of this. However, Hitler refused to believe all of this, dismissing it as "the greatest imposture since Genghis Khan". And in preparation of the upcoming Soviet offensive, Heinz Guderian had proposed to evacuate the trapped Army Group North in Courland, to help get enough manpower to atleast weaken the offensive. Hitler however forbade it. And also, instead of diverting the 6th SS Panzerarmy to poland, Hitler diverted it to Hungary to participate in Operation Frühlingserwachen. \n\nIn the end, the offensive was an overwhelming success for the Soviets. In only 2 weeks, the Red Army had advanced 483km (300 miles). They managed to take all of German occupied Poland, along with a large amount of German territory, and with several destroyed and encircled German divisions. However, the final offensive for Berlin was halted due to stubborn German resistance in Silesia and Pomerania, and also in East Prussia."
intro.10.t:0 "Operation Frühlingserwachen"
intro.10.d:0 "Operation Frühlingserwachen was the last major offensive for Germany in WW2. The Operation began on March 6th with the goal of securing the extremely important oil fields in Hungary. The 6th SS Panzerarmy, among others, was secretly diverted from the Western Front to Hungary for the operation, instead of sending it to the completely demolished Army Group A and Mitte in Germany. It joined up with the reformed 6th Army to launch the attack north of Balaton. \n\n10 Panzer Divisions, 5 Infantry Divisions and a large amounts of Tiger II's began their advance North of Balaton. Their aim was to reach the Danube and link up with the 2nd Panzerarmy, which was located South of Balaton. The attack initally began well, but as they got closer to the Danube, several factors and strong Soviet resistance halted the advance. Already by the 14th, none of the objectives had been achieved, and the planned link up with the 2nd Panzerarmy never happened. \n\nOn the 16th, the Soviets made a counteroffensive that drove the Germans back to their starting position, and further. The huge numerical superiority held by the Soviets made any defense for the Germans completely impossible, and on April 13th they managed to capture Vienna. \n\nUltimately, Frühlingserwachen was nothing but an ambitious plan doomed to absolutely fail from the start. As Sepp Dietrich, the commander of the 6th SS Panzerarmy put it, 'We call ourselves the '6th Panzer Army', because we've only got 6 Panzers left.'"

# Flavour Events #
scenario.1.t:0 "Heeresgruppe B surrenders!"
scenario.1.d:0 "Feldmarschall Walter Model has radioed the apparent surrender of the encircled Heeresgruppe B in the Ruhr Pocket after two weeks of fanatic fighting. Early reports have come in stating the suicide of Model following this defeat. \n\nPropaganda Minister Joseph Goebbels have publicly denounced Heeresgruppe B as traitors to the Reich."
scenario.1.a:0 "Traitors!"
scenario.2.t:0 "Himmler's Betrayal"
scenario.2.d:0 "The treacherous Heinrich Himmler have secretly attempted to sue for a separate peace with the Allied forces! \n\nHimmler has in the midst of chaos arranged negotiations with Count Folke Bernadotte, using his masseur, Felix Kersten as an intermediary. With an arrest of Himmler ordered by Hitler and the negotiations failed, he has since gone into hiding."
scenario.2.a:0 "Betrayal!"
scenario.3.t:0 "Fegelein's Execution"
scenario.3.d:0 "The deserting Hermann Fegelein, has been found by Reichssicherheitsdienst Peter Högl in his Berlin apartment preparing to flee to Sweden after refusing to participate in what he deems a 'suicide pact.' Fegelein has since his capture been tied as an accomplice to the betrayal of Himmler, and been promptly brought back to the Reichsbunker where he was sentenced to death."
scenario.3.a:0 "Fegelein! Fegelein! Fegelein!"
scenario.4.t:0 "Birth of the Flensburg Government"
scenario.4.d:0 "As the allied forces advance on all fronts, Admiral Karl Dönitz assumes the role as Führer following Hitler's suicide. Situated in Flensburg, the new government is tasked with insurmountable task of adminstrating the unoccupied territories of the Reich."
scenario.4.a:0 "A three week Reich."
scenario.5.t:0 "Adolf Hitler Commits Suicide!"
scenario.5.d:0 "The Führer, $GER_adolf_hitler$, has been found dead in his bunker. With enemy forces closing in, it seems the Führer decided to take his own life rather than risk capture. In order to prevent demoralization of the troops, our propaganda outlets are being briefed that Hitler died fighting heroically to his last breath in the face of overwhelming enemy forces. With the death of the Führer, Karl Dönitz assumes the role."
scenario.5.a:0 "The war is lost."
scenario.6.t:0 "Battle of Castle Itter"
scenario.6.d:0 "On the fifth of May, American armored tank battalions launched an attack on Castle Itter. French tennis star Borotra assisted the Allied attack by vaulting up the castle walls to deliver vital information of the enemies positions. This day marks one of the strangest battles of the entire war, and will surely be a story to tell for decades to come."
scenario.6.a:0 "Cowards!"
scenario.7.t:0 "Prague Uprising"
scenario.7.d:0 "Seeking to take advantage of the crumbling state of the Heeresgruppe Ostmark, Czech insurgents have seized control of large portions of Prague's districs and critical communication lines. With German patrols across the city overwhelmed and overrun, the Czechoslovak flag can already be seen flying from windows.\n\nFor now, fighting remains sporadic—but with reinforcements massing on the outskirts, this appears to be only the calm before the storm."
scenario.7.a:0 "Bah, such optimists!"
scenario.8.t:0 "Goebbels' Commits Suicide!"
scenario.8.d:0 "Reichsminister of Propaganda Joseph Goebbels, has taken his own life in the Führerbunker. With soldiers of the Red Army concluding the inferno that is the Battle of Berlin and the Führer's death, Goebbels has chosen to follow the path of his Führer rather than deal with the wreckage of the Third Reich.\n\nThe future of the Reich now only hangs on but a thread."
scenario.8.a:0 "Another one bites the dust."
scenario.8.b:0 "So much for Endsieg."
scenario.11.t:0 "Desertions"
scenario.11.d:0 "A disturbing rumor has been circulating around the 25. Armee of a soldier falsely pretending to be a Luftwaffe Hauptmann, bossing around, issuing orders and establishing an irregular band of soldiers behind him. \n\nHis journey of delinquency has so far involved reconnaisance missions, failed skirmishes and a peculiar encounter with a prison camp housing deserted Wehrmacht soldiers. \n\n'Hauptmann' Willi Herold's whereabouts are currently unknown"
scenario.11.a:0 "Deserters will be shot!"
scenario.12.t:0 "Der Führer's Birthday"
scenario.12.d:0 "Berlin is wrecked by unstoppable Allied strafing runs and the once mighty city is mere rubble. Hitler sits in the Führerbunker celebrating his birthday alongside Wehrmacht, Nazi and SS aides. \n\nThe future for the Reich seems bleak, but perhaps a final, decisive counterattack will roll over the Soviets? Uncertainty hangs in the air and Hitler has taken a stroll outside of his bunker, seeing all but the remains of wartorn buildings. "
scenario.12.a:0 "The sounds of bombings overshadow this day."
scenario.14.t:0 "Hitler visits the Front"
scenario.14.d:0 "The Führer, $GER_adolf_hitler$, on what would be his final visit to the front, has traveled to the 9th Army on the Oder. \n\nIn a meeting within the walls of Schloss Freienwalde, Hitler urged General Theodor Busse and his officers to hold back the advancing Red Army, long enough to deploy his new weapons."
scenario.14.a:0 "What are these new weapons he speaks of?"
scenario.15.t:0 "Reorganization in the West"
scenario.15.d:0 "The situation of Oberbefehlshaber West is deteriorating.\n\nThe loss of vital communication links and the evolving battlefield necessitate a reorganization of our command structure. A new order has been issued to adjust our operations in the western theatre of war to better align with the changing circumstances."
scenario.15.a:0 "Adapt and Overcome."
scenario.13.t:0 "German Instrument of Surrender"
scenario.16.t:0 "Operation Frühlingserwachen Commences"
scenario.16.d:0 "Our offensive aimed at retaking the Hungarian oil fields is set to begin today. \n\nDoing a successful pincer movement around lake Balaton could very well lead to a large Soviet encirclement, and then we'll be able to move further east. \n\nMay we succeed, we could even retake all of Hungary."
scenario.16.a:0 "This shall turn the tide."
scenario.17.t:0 "Destruction of the Wolfsschanze"
scenario.17.d:0 "The Wolf's Lair, Adolf Hitler's military headquarter of the Eastern Front has been blown up and abandoned ahead of the advancing Red Army. \n\nDespite the harsh conditions of winter and the lack of sufficient explosives, preparations were carried out at night-time. Seeing the size of the fortifications, the explosives have only managed to partially destroy the buildings."
scenario.17.a:0 "They will not avail this!"
scenario.18.t:0 "WITHDRAWAL FROM THE COUR POCKET, INITIALIZATION OF DISCIPLINARY PROCEEDINGS"
scenario.18.d:0 "Decision to evacuate the Cour Pocket. Head of the General Staff of the Army, Colonel Heinz Guderian reported to have undertaken measures to retrieve Army Group Courland. Action taken without previous permission of Oberster Befehlshaber der Wehrmacht Adolf Hitler.\n\nFuhrer Adolf Hitler allegedly furious, disciplinary measures will be taken in order to ensure morale within the ranks are restored.\n\nFührerbunker, [GetDateText]"
scenario.18.a:0 "Damn that man!"
scenario.19.t:0 "Victory or Death"
scenario.19.d:0 "An overwhelming Allied armada have swept ashore to the island of Okinawa - carving an open pathway to the inner lands of Japan.\n\nEvery hill, trench and cave is to be held at all costs to the last man against the invading Americans. Kamikaze attacks and all our naval might will embroil in this great struggle for victory!\n\n"
scenario.19.a:0 "The americans cannot be allowed to win!"
scenario.19.b:0 "Unleash the Kamikaze."
scenario.20.t:0 "Disastrous Defeat at Okinawa"
scenario.20.d:0 "The battleship Yamato, while underway with other warships to the fiercely contested island of Okinawa came under heavy fire from American carrier aircraft. After suffering relentless blows from waves of enemy aircraft, Yamato succumbed to her injuries, unable to defend herself and engulfed in an inferno of fire before sinking beneath the waves."
scenario.20.a:0 "The bigger they come, the harder they fall."
scenario.21.t:0 "Operation Ten-Go Successful"
scenario.21.d:0 "The Americans were taken by complete surprise by the arrival of our battleship Yamato. Utilizing the heavy fog in the area, Yamato and her task force managed to sink several capital ships before succumbing to their own injuries by enemy aircraft."
scenario.22.t:0 "Typhoon of Steel"
scenario.22.d:0 "The ferocity of the fighting in Okinawa has reached an unprecedented level. Storms of kamikaze squadrons descend relentlessly into both the ground and Allied naval fleet, showcasing the very brutality of their fruitless efforts.\n\nThe unforgiving mud, rain and our continuous bombardment weigh heavily on the american morale and discipline, steadily eroding their resolve."
scenario.22.a:0 "They are faltering."
scenario.24.t:0 "Borneo under Siege"
scenario.24.d:0 "Supported by a substantial Allied naval force, Australian troops have established a string of beachheads along the shores of Borneo. Despite the best efforts of our garrison to maintain their positions, their resistance has proven futile against the heavy enemy assault."
scenario.24.a:0 "The jungle will eat them alive."
scenario.25.t:0 "Hirohito Wishes to Surrender"
scenario.25.d:0 "The war situation has developed not necessarily to Japan's advantage. With the Allies knocking at our very door, any further resistance seems futile. Needless losses have occurred and more shall follow if this mad pursuit for pyrrhic victory carries on.\n\nWith too many lives at stake, emperor Hirohito has declared his intention to surrender, and with it he has recorded a message to be broadcast to the nation the following day."
scenario.25.a:0 "For posterity, the only way."
scenario.25.b:0 "Surrender be damned. Do something against this folly!"
scenario.26.t:0 "Kyujo Incident"
scenario.26.d:0 "Loyal soldiers and officers of Japan have successfully stormed and secured the Imperial Palace grounds of our emperor Hirohito. After frantic hours of scouring the palace for Hirohito's recordings, an army battalion car was stopped in a routine check, found to attempt to smuggle out the recordings.\n\nIt would seem to our benefit that the Imperial Guards were no match for the determination of those who seek to save the nation from humiliation and defeat. Echoes of gunfire in the Imperial Palace hall and surrounding areas have faded as hardliners led by General Anami Korechika have taken control. The Emperor, his plans for surrender halted in their tracks, has been placed under 'protective custody.'\n\nLoyal officers of the Empire raise their banners in the name of the coup. 'Japan will never bow!'"
scenario.26.a:0 "For the Glory of the Empire!"
scenario.27.t:0 "Invasion of Japan"
scenario.27.d:0 "What we've feared for far too long has happened. In the early hours of morning, the horizon off Kyushu has been filled with a fleet so overwhelming it goes beyond horizon.\n\nFrom the shores of Kyushu to the firebombed cities in the east, wave after wave of airplanes cover the skies with steel. The shores go red as landing crafts lie silent beneath the water.\n\nOperation Ketsugo, the defense of our homeland, has been reluctantly set in motion. Civilians - whether they be men or women, are to take part in this struggle for our survival."
scenario.27.a:0 "We will defend Japan to the last!"
scenario.28.t:0 "Japan Wants to Renew the Non-Aggression Pact"
