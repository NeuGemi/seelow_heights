scenario.32.a:0 "We must strengthen the Kwantung Army!"

# News events #
scenarionews.1.t:0 "Fall of Vienna"
scenarionews.1.d:0 "The City of Vienna, under the Nazi control for the past decade has been liberated by Soviet forces, this comes after a period of extensive urban siege due to the ad-hoc formations to stove off capture by the Red Army. This is a major blow to the Nazi war effort and will surely thin their morale even harder, Europe waits teetered for whatever good may come next..."
scenarionews.1.a:0 "This is a major victory in the anti-Nazi war effort and will surely symbolise the end of Germany's rampage."
scenarionews.1.b:0 "For Endsieg is still to come, we must not fret over isolated defeats!"
scenarionews.2.t:0 "Battle of Berlin"
scenarionews.2.d:0 "Heavy fighting has been declared across the entire stretch of the Oder-Neisse River as the Soviets are mounting a final offensive to crush Germany and capture the nation's heartland- Berlin. \n\nThe Soviets have started off massive artillery raids across the river line while the Germans themselves have formed ad-hoc defenses and gathered everything possible to hold off the Red Army. \n\nDue to fog of war, not much is known, but combined attacks are being declared alongside major fighting at the Seelow Heights region where Soviet troops have bridgeheads across the Oder river just west of Küstrin."
scenarionews.2.a:0 "Peace in Europe is near, we pray that the Soviets succeed in their quest."
scenarionews.2.b:0 "Let them come."
scenarionews.3.t:0 "Mussolini Captured and Executed"
scenarionews.3.d:0 "In the late hours of April 27th, Mussolini and his wife were captured by partisans while attempting to cross the Swiss border. Mussolini has reportedly been killed and his body is triumphantly being displayed in a public square in Milan. \n\nDoes this spell the end of fascism in Italy?"
scenarionews.3.a:0 "That's the end of his war."
scenarionews.4.t:0 "Nazi defeat in the Ruhr"
scenarionews.4.d:0 "The bulk of German forces of the western front, Heeresgruppe B, has surrendered within the Ruhr Pocket - after weeks of fierce attritional warfare, akin to the encirclement and defeat of the German 6. Army in Stalingrad"
scenarionews.4.a:0 "Interesting."
scenarionews.4.b:0 "This is a disaster!"
scenarionews.5.t:0 "Magdeburg Liberated; Industrial Slave Camps Freed!"
scenarionews.5.d:0 "Today, U.S troops have liberated the city of Magdeburg on the right bank of the Elbe River just after a series of major fighting in the suburbs followed by heavy clashes in the center of the city where the measly German forces after a month of nonstop combat were pushed away. \n\nWhat remains to be seen is images of horror, the American troops have discovered industrial-level slave camps with many of them being actively freed as of yet. Another record of Nazi atrocity, the liberated are mourning the lost and local officials are preparing military administration."
scenarionews.5.a:0 "Europe comes one step closer to morning."
scenarionews.5.b:0 "The end is not near! Fight on!"
scenarionews.6.t:0 "Fall of The Italian Social Republic"
scenarionews.6.d:0 "The Italian Social Republic has fallen following the advancements of the Allied armies in Northern Italy. \n\nThe surrender of all German and Italian forces in Italy is under effect and will be a serious blow to the German war effort. The question now remains if the Allies will keep up their momentum. \n\nNow the Allied forces look to the north."
scenarionews.6.a:0 "Interesting."
scenarionews.6.b:0 "Traitors, defeatists!"  
scenarionews.7.t:0 "The Fall of Budapest"
scenarionews.7.d:0 "Today, on[GetDateText], Soviet Divisions stormed the Hungarian capital Budapest after a 50 day long siege. Fanatic SS-resistance is still going on in small pockets throughout the town, but most notably in the Gellért-hegy. \n\nUnder heavy fog, several German and Hungarian soldiers managed to escape from the ongoing chaos, to regroup with the main combat line. Several relief attempts have failed. The Battle of Budapest is over."
scenarionews.7.a:0 "The Soviets are advancing."
scenarionews.8.t:0 "Fall of Königsberg"
scenarionews.8.d:0 "The city of Königsberg - once a jewel of Prussian architecture, has been stormed and captured by Soviet Forces after a prolonged and brutal siege. Frantic escape attempts by boat or across the ice of the Vistula lagoon were attempted by German civilians and soldiers mere hours before the last pockets of resistance had been dealt with. \n\nThis marks a significant victory for the Soviets, bringing them one step closer to Berlin."
scenarionews.9.t:0 "President Franklin D. Roosevelt Pronounced Dead!"
scenarionews.9.d:0 "Today, President Roosevelt, 32nd President of the United States has been declared dead, this afternoon. The President reportedly died from a stroke while residing in Warm Springs, Georgia. His portrait was being made by Mrs. Shoumatoff followed by him stating... "I have a terrific headache.".\n\nHe was quickly diagnosed by his attending cardiologist; Mr. Bruenn. President Roosevelt's medical emergency had been declared a intracerebral hemorrhage which would explain his timely death following his remarks. Currently, President Truman has been inaugurated after the fact of his oath, the people of the United States mourn as their wartime leader has been taken away so shortly after his term."
scenarionews.9.a:0 "This is a time for mourning, for America's inspiring leader has been taken away."
scenarionews.9.b:0 "Good riddance the bastard is dead, this is what we needed. Endsieg is near!"
scenarionews.9.c:0 "Prime Minister Suzuki will voice sympathy for the President amidst our negotiations."
scenarionews.10.t:0 "Allied troops connect with the Soviets at the Elbe!"
scenarionews.10.d:0 "Today, remarkable news have arrived of American troops making contact with the Soviets on the German front along the river 'Elbe'. Massive celebrations are breaking out as 4 years of combat in Europe have finally led to the conclusive end whereby Soviet and Allied troops will finally stamp out the Nazi Regime once and for all- for the better of humanity."
scenarionews.10.a:0 "We send our congratulations to the Soviets"
scenarionews.10.b:0 "This is a disaster!"
scenarionews.10.c:0 "This calls for a celebration!"
scenarionews.10.e:0 "After a year of combat, it has finally paid off."
scenarionews.11.t:0 "War in the Pacific Extends to Northeast China!"
scenarionews.11.d:0 "Harrowing news have arrived for the final standing Axis belligerent state, the Empire of Japan. Soviet troops alongside those of the Mongolians have started a massive military operation across the entire Dongbei-Mongolia front.\nMajor fighting had recently started across the massive stretch of land over an area the size of the Western European theatre, unfortunately fog of war encapsulates the extension of the conflict, but the very end of the Second World War may be nearing."
scenarionews.11.a:0 "This seems to be the final showdown..."
scenarionews.11.b:0 "We will not let them enact revenge for 1905!"
scenarionews.11.c:0 "Our boys will be home soon."
scenarionews.12.t:0 "Fourth Inauguration of President Roosevelt"
scenarionews.12.d:0 "On this very day, United States President Roosevelt will take his fourth oath for office ― administered by Chief Justice Stone. This day also marks the exit of the progressive Henry Wallace from the Vice Presidency and his replacement by the dark horse Great War veteran Harry Truman, decade long Senator from Missouri. Despite the administering of oath and the following address being cut short ― Franklin D. Roosevelt has led the Democratic Party for its 4th consecutive term in office."
scenarionews.12.a:0 "We send our regards to Roosevelt!"
scenarionews.12.b:0 "May his rule end!"
scenarionews.13.t:0 "Battle of Iwo Jima"
scenarionews.13.d:0 "The sands of Iwo Jima run red as the US Marine Corps lands on the heavily fortified island - in a bid to secure airfields and establish a strategic base for operations closer to mainland Japan.\n\nFighting has been ongoing since the early hours of morning, and has seen ferocious fighting despite the island's small size.\n\nIt remains to be seen how the fate of the battle will turn out."
scenarionews.13.a:0 "The road to Tokyo begins here."
scenarionews.14.t:0 "Battle of the Bulge Ends"
scenarionews.14.d:0 "The battle of the bulge, a surprise offensive by the Germans has concluded. The conflict, which lasted for several weeks, saw forces on both sides engage in intense combat under severe winter conditions.\n\nDespite initial successes, the German forces were unable to sustain their advance due to Allied counterattacks and the harsh conditions of winter. The battle has resulted in severe losses for the German side, further weakening their already strained resources."
scenarionews.14.a:0 "The allies are victorious."
scenarionews.14.b:0 "How could this happen?"
scenarionews.15.t:0 "Battle of Okinawa Begins"
scenarionews.15.d:0 "An overwhelming forces of Allied ships and personnel battles for the island of Okinawa, located adjacent to the Japanese Inner Lands.\n\nJapanese defenders are using every available means to hold back the tide - from entrenched positions in the hills to kamikaze strikes against the enemy fleet, they go to every extent to slow down the Allied advance.\n\nShould Okinawa fall, the Japanese homeland itself will lie exposed."
scenarionews.15.a:0 "The Yanks are coming..."
scenarionews.15.b:0 "Keep it up, lads!"
scenarionews.16.t:0 "Armistice Cabinet ousted - Army declared control"
scenarionews.16.d:0 "Loyalist officers of the Imperial Army have successfully seized control of the government of Japan. Under the cover of night, military forces stormed the Imperial Palace, neutralized the Emperor's supporters, and placed His Majesty under protective custody. The rising sun now flies above a government committed to fighting for Japan’s survival at all costs, with voices chanting slogans in unison.\n\nThe city of Tokyo has fallen in an eerie silence as soldiers loyal to the new regime flood the city."
scenarionews.16.a:0 "Death over dishonor."
scenarionews.16.b:0 "Will they ever give up?"
scenarionews.17.t:0 "Massive Invasion of Japanese mainland begun"
scenarionews.17.d:0 "A communique from the Pacific Theater bears news of an overwhelming force of Allied troops landing ashore on the Japanese mainland. The fighting has already seen an unprecedented level of brutality and ferocity on a vast scale.\n\nNot much else is known of the fighting in Japan other than news of casualties mounting rapidly on both sides, with armed militias embroiled in the conflict."
scenarionews.17.a:0 "May the glory of our Holy Emperor of Japan Hirohito aid us in this."
scenarionews.17.b:0 "The war has not developed to their advantage."

