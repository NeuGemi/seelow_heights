### Bookmarks ###
SEELOW_NAME:0 "泽劳弗高地战役"
SEELOW_DESC:0 "第二次世界大战即将结束。随着盟军和苏联的持续进攻，德国国防军的连连败退导致丧失了曾经占领与包括本土在内的大片土地。盟军冲向易北河，而红军炮击柏林，纳粹德国在每条战线上都失败了，戈培尔高呼要进行一场全面战争并取得最终胜利，但最后并没有成功。\n在太平洋战场，灾难性的“天一阁”行动重创了日本最后的舰队。美国海军正在硫磺岛、冲绳和菲律宾的登陆已经将他们逼入绝境。"
BERLIN_DESC:0 "在短短几天内，红军控制了柏林外围，包围，分割并摧毁国防军的几支部队。由于第9集团军的士兵被分割在哈尔贝、柏林和苏台德地区，大规模的混乱与集体投降便随之而来。 \n西线国防军的崩溃意味着盟军可以在德国南部和整个意大利毫无抵抗的情况下前进，而苏联红军则继续向布尔诺和克罗地亚地区推进。"
BERLIN_NAME:0 "柏林战役"
GER_SEELOW_DESC:0 "现在的德国不过是一片废墟，曾经强大而精良的德国军队现在只剩下了一群残兵败将。当德国衰败，盟军从西方向易北河进发，而苏联正准备从东方进行最后的决战时，战争已经可以看见尾声，柏林已经触手可及。希特勒却依旧在等待他的最终胜利时大发脾气。"
ITA_SEELOW_DESC:0 "自从意大利丧失掉她的“一半靴子”之后，法西斯在意大利的统治已经终结了，盟军已经攻入罗马，兵锋直取米兰，曾经的领袖现在已经不知所踪，意大利正在重新审视她的未来。"
CRO_SEELOW_DESC:0 "克罗地亚独立国由德国扶持参加了轴心国，奉行纳粹德国法西斯政策，最终在1945年被南斯拉夫人民军歼灭。"
SLO_SEELOW_DESC:0 "1940年10月26日，斯洛伐克加入《德意日三国同盟条约》，正式成为了轴心国成员。在次年夏天开始的“巴巴罗萨行动”中，斯洛伐克也参与了进攻苏联。1945年4月4日，苏联红军占领了布拉迪斯拉发，蒂索政权倒台。"
JAP_SEELOW_DESC:0 "经过十几年的不间断战争，同盟国已经越来越接近日本本土，旭日显然已日薄西山。曾经骄傲的海军已被浩瀚的太平洋完全吞没，陆军的实力同样江河日下，随着美国海陆战队在硫磺岛、冲绳和菲律宾的成功登陆，他们已然发现自己走投无路。\n\n然而，随着“Ichi-Go”（这个行动就是我们所说的豫湘桂战役，国民党以惨败告终）行动的成功，日本陆军能在美国人东京皇居阅兵前结束在中国的战争吗？他们又能在冲绳击退美国第十集团军吗？"
MAN_SEELOW_DESC:0 "1945年8月8日，苏联照会日本，将于次日对日本宣战。随后苏联红军攻入中国东北，以高度机械化的绝对优势击败关东军和“满洲国军”，在吉冈安直的安排下，伪满洲国皇帝溥仪宣读退位诏书，宣布伪满政府解散，后溥仪等人在逃亡途中被苏联红军俘虏，伪满政权彻底灭亡。"
MEN_SEELOW_DESC:0 "这个伪政府消失于1945年，在第二次世界大战的最后几周，作为八月风暴行动的一部分，苏联红军和蒙古人民军对日宣战，攻入内蒙。日本侵略者投降，蒙疆政府垮台。"
SIA_SEELOW_DESC:0 "1945年，日本帝国大势已去，此时的暹罗找准时机，立刻日本宣战。在日本投降的第二天，暹罗政府发表《和平宣言》，宣称被迫与日结盟，并废除一切与日本签订的条约。"