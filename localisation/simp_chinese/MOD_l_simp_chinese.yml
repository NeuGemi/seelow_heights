### Ideas ###
surrender_limit:0 "禁止投降！"
GER_totalen_krieg_doctrine:0 "全面战争"
GER_totalen_krieg_doctrine_desc:0 "'我们的国家已经到了最后关头，必须动员大日耳曼的全部力量来对付敌人！'"
GER_shattered_wehrmacht:0 "国防军的末日"
GER_shattered_wehrmacht_desc:0 "经过6年不间断的激烈战斗，国防军终于屈服了。这支曾经令世界为之颤栗的军队，现在只剩下了一副残破不堪的骨架。当其他集团军深陷包围或困居海外时，东线爆发的柯尼斯堡战役带来的惨败，已经迫使希特勒只能通过组建临时集团军来保卫“祖国”的最后几片土地。将军队分散使用已经无法避免，即使是当前尚存的最精锐的国防军也缺少在与向东西两线势如破竹的苏联和盟军的大小战斗中所需的基本装备。\n\n但根据“元首”和宣传部长约瑟夫·戈培尔的说法，我们并没有失去一切，他呼吁在剩下的战斗中实现“终结”或所谓的“最终胜利”。随着富兰克林·罗斯福的逝世，希特勒开始相信胜利几乎是板上钉钉."
JAP_shattered_army:0 "日落扶桑"
JAP_economic_collapse:0 "轰炸与毁灭"
GER_economic_collapse:0 "盟军的炮火" 
GER_economic_collapse_desc:0 "“敌人无穷无尽的炮弹与航弹将我们土地上的一切化为灰烬。”"
GER_endsiegmod:0 "最终的胜利"
GER_endsiegmod_tt:0 "\n§ “我就在这里,和我的帝国一起！”§!"
GER_scenariointro_tt:0 "§你可以在“决议”选项中找到移除debuff的选项§!"
GER_scenario_volkssturm:0 "人民冲锋队"
GER_scenario_volkssturm_desc:0 "“人民冲锋队”是由“全面战争”计划制定者约瑟夫·戈培尔推动创立的一支临时平民武装部队。他一直极力主张利用帝国的一切必要资源来防止东方“布尔什维克次人”全面吞噬德国，这项计划的战略目标仅仅是减缓苏联人的推进。“人民冲锋队的无差别征兵没有给那些妄图放弃“最终胜利”的人留下任何逃跑的余地。这样一只临时武装的整体装备不出所料的很差，而且几乎没有经过任何军事训练。他们被用作当下前线和柏林“最终时刻”的战斗力量，并被寄予希望可以为胜利创造条件."
GER_renewed_wehrmacht:0 "国防军"
GER_disloyalty:0 "滋生的叛心"
GER_disloyalty_desc:0 "帝国正处于毁灭的边缘，因为兵士们放弃了对盟军的抵抗，所以西线几乎丧失了防御能力，随着莫德尔的第15集团军四分五裂，有关指挥者正在准备撤退投降的传言蔓延开来。在这方面，整个帝国总部的德国将军们都“背叛”和“拒绝”了“元首”的命令，当希特勒绝望地咆哮：'我是如何被你们这些人背叛的！”以及他自己怎样怎样对征服整个欧洲负有使命时，此刻发生的一切已经完全令他失去控制\n\n对于其他国家：苏联和盟国来说，随着德国国防军士气像流沙一样下沉，欧洲上空的朝阳正在升起。§W\n\n“如果这个问题得不到解决，那么就没有帝国可供保卫了' §!"
GER_economic_collapse_tt:0 "§Y\n'当投降进度低于1%时将被移除' §!"
SOV_berlin_strategic_offensive_operation:0 "柏林战略进攻行动"
RAJ_burmese_campaign:0 "缅甸战役 (1944–1945)"
SOV_allied_control_commission:0 "盟军监督委员会"
acc_tt:0 "§Y这个国家在盟军监督委员会的监督下§!"
operation_hannibal_tt:0 "§Y汉尼拔行动：“一项从东普鲁士的包围中通过海路撤离德国军队和平民的行动，目前正在进行中§!"
the_united_nations:0 "联合国"
CHI_endsiegmod:0 "抗日战争"
GER_ag_c_surrender_tt:0 "§R在意大利领土上的所有德国军队都投降了§!"
ENG_europe_first_strat:0 "'欧洲优先”战略'"
flensburg_tt:0 "\n§如果德国未能发起有效攻势来夺回柏林，邓尼茨领导的弗伦斯堡政府将会投降§!"

### Events ###
intro.1.t:0 "第三帝国的末日"
intro.1.d:0 "战争已经接近尾声\n\n苏联红军在维斯瓦河攻势中取得的巨大战果为毫无疑问地为进攻柏林奠定了基础。柏林的防御现在由希特勒青年党卫军、人民冲锋队和筋疲力竭的第9军的混合部队负责。\n\n与此同时，在西线战场，盟军继续向德国领土纵深推进，并成功包围了防守德国工业区腹地的瓦尔特·莫德尔的B集团军。西线的其他防御部队仅剩下一些战斗群和建制几近崩坏的师组成，而且其中一些师只剩下纸面数据了。"
intro.1.a:0 "他们，来了..."
intro.2.t:0 "夕阳"
intro.2.d:0 "经过十几年的不间断战争，同盟国已经越来越接近日本本土，旭日显然已日薄西山。曾经骄傲的海军已被浩瀚的太平洋完全吞没，陆军的实力同样江河日下，随着美国海陆战队在硫磺岛、冲绳和菲律宾的成功登陆，他们已然发现自己走投无路。\n\n然而，随着“Ichi-Go”（这个行动就是我们所说的豫湘桂战役，国民党以惨败告终）行动的成功，日本陆军能在美国人东京皇居阅兵前结束在中国的战争吗？他们又能在冲绳击退美国第十集团军吗？"
intro.2.a:0 "他们，到了..."
intro.3.t:0 "柏林战役"
intro.3.d:0 "苏联红军进军柏林对德国国防军来说巨大的灾难。\n\n在短短几天内，红军控制了柏林外围，包围，分割并摧毁国防军的几支部队。由于第9集团军的士兵被分割在哈尔贝、柏林和苏台德地区，大规模的混乱与集体投降便随之而来。\n\n西线国防军的崩溃意味着盟军可以在德国南部和整个意大利毫无抵抗的情况下前进，而苏联红军则继续向布尔诺和克罗地亚地区推进。"
intro.3.a:0 "一切都快结束了..."
scenario.1.t:0 "B集团军正式投降！"
scenario.1.d:0 "德国陆军元帅瓦尔特·莫德尔通过无线电宣布，经过两周的激烈战斗后，被包围的德国B集团军已经在鲁尔工业区投降。不久这位心力交瘁的德国元帅在卫兵的驱车下前往野外，一个人走进森林，把一发子弹打进了自己的头部。\n\n纳粹宣传部长约瑟夫·戈培尔公开宣布整个B集团军为帝国的叛徒。"
scenario.1.a:0 "一帮叛徒!"
scenario.2.t:0 "希姆莱的背叛"
scenario.2.d:0 "背信弃义的海因里希·希姆莱试图单方面秘密与盟军求和！ \n\n希姆莱多次由他的按摩师克斯滕作为中间人与瑞典红十字会副主席康特·弗尔克·贝纳多特会面商议投降事宜。\n\n希特勒下令逮捕希姆莱，谈判因此失败，希姆莱换上党卫军服装，戴上黑色独眼罩，从此开始了逃亡生涯。"
scenario.2.a:0 "立刻抓住他！"
scenario.3.t:0 "菲格莱因的处决"
scenario.3.d:0 "叛逃的赫尔曼·菲格莱因在拒绝参加他认为的“自杀协议”后，在柏林的公寓里被党卫队中央安全办公室的彼得·许格尔发现，当时他正准备逃往瑞士，被捕后一直被视为希姆莱叛国投降案的同谋，并被迅速带回，4月29日被希特勒下令以叛国罪将他枪毙。"
scenario.3.a:0 "菲格莱因！菲格莱因！菲格莱因！"
scenario.4.t:0 "弗伦斯堡政府的诞生"
scenario.4.d:0 "随着反法西斯军队在各条战线上的高歌猛进，卡尔·德尼茨海军上在希特勒自杀后担任帝国元首。新政府位于弗伦斯堡，肩负着保护帝国残余领土的艰巨任务。"
scenario.4.a:0 "三周帝国的建立"
scenario.5.t:0 "阿道夫·希特勒自戕！"
scenario.5.d:0 "元首，$GER_adolf_hitler$, 被发现死在他的地堡里。随着红军的逼近，元首似乎决定自我了断而不是被俘虏。为了防止因此而可能导致的士气打击，我们的宣传机构正在发送通讯，我们的元首在面对压倒性的敌军时英勇地战斗到了最后一刻。随着元首的逝世，卡尔·德尼茨（Karl Dönitz）接管的帝国政府。"
scenario.5.a:0 "这场战争我们输了"
scenario.6.t:0 "伊特城堡战役"
scenario.6.d:0 "5月5日，美国装甲坦克营向伊特城堡发动了进攻。（该监狱城堡的VIP有：法国前总统阿尔贝·勒布伦，法国总理爱德华·达拉第，法国前总理保罗·雷诺、法军总司令毛利斯·甘莫林、法军一战名将马克西姆·魏刚、戴高乐将军的姐姐玛丽·戴高乐以及真正的重量级：法国网球明星让·布鲁特拉)这位网球健将通过撑杆跳翻过城堡墙壁，并提供了敌人阵地的重要信息。\n\n这一天标志着整个战争中最奇怪的战斗之一，肯定会成为未来几十年的笑谈。"
scenario.6.a:0 "胆小鬼！"
scenario.7.t:0 "布拉格起义"
scenario.7.d:0 "令人震惊的消息传到了已经分崩离析的厄斯特马克集团军群，布拉格发生了起义。 据报道，捷克的武装分子已经夺取了该市大部分地区的控制权。 \n\n到目前为止，布拉格的武装分子和当地驻扎的武装党卫队士兵之间只发生了零星巷战。"
scenario.7.a:0 "我们将夺回属于我们的东西。"
scenario.8.t:0 "戈培尔自杀！"
scenario.8.d:0 "在柏林各地激烈的巷战中，宣传部长约瑟夫·戈培尔在希特勒死亡后在元首府自杀。"
scenario.8.a:0 "不太关心。"
scenario.11.t:0 "冒牌上尉"
scenario.11.d:0 "一个令人不安的消息一直在四处流传：一名逃兵伪装成德国空军上尉，四处发号施令并在他身后组建一支非正规军事队伍。\n\n这群乌合之众组成了自己的“H特遣队”与“赫罗德”审判庭，一路烧杀抢掠，无恶不作，所到之处一片狼藉。 \n\n“空军上尉”威利·赫罗德目前下落不明。"
scenario.11.a:0 "逃兵都该被枪毙！"
scenario.12.t:0 "元首的生日"
scenario.12.d:0 "柏林被势不可挡的盟军攻势摧毁，这座辉煌的都市如今只剩下瓦砾。希特勒坐在元首专车上，与德国国防军、纳粹和党卫军助手一起庆祝生日。\n\n帝国的未来似乎很黯淡，但也许最后一次决定性的反击会打败苏联？空气中弥漫着不确定性，希特勒在地堡外散步，除了被战争摧毁的废墟以外什么都看不见。"
scenario.12.a:0 "爆炸声使这一天黯然失色。"

scenarionews.1.t:0 "维也纳沦陷"
scenarionews.1.d:0 "经过长时间的围困，曾经于纳粹控制下的维也纳已被苏联军队解放，这是对纳粹德国的重大打击，他们的部队已然溃散，欧洲正在等待光明的未来。。。"
scenarionews.1.a:0 "这是反法西斯战争的一次重大胜利，必将象征着暴虐德国的死亡。"
scenarionews.1.b:0 "因为“最终胜利”还未到来, 我们决不能为一次的失败而放弃！"
scenarionews.2.t:0 "柏林战役"
scenarionews.2.d:0 "随着苏联发动最后一次攻势来占领纳粹德国的心脏柏林，奥德河—尼斯河沿线已经陷入全面激战。 \n\n苏联已经开始了对河对岸的大规模炮击，而德国人自己也依靠着特殊防御，尽一切可能阻止红军过河。 \n\n由于战争迷雾，目前所知不多，但在泽劳弗地区的主要战斗中，联合攻击已经开始，苏联军队将会在那里的桥头横跨奥德河。"
scenarionews.2.a:0 "欧洲的和平即将到来，我们祈祷苏联在击碎恶魔的道路上取得成功。"
scenarionews.2.b:0 "放马过来。"
scenarionews.3.t:0 "墨索里尼被捕并被处决"
scenarionews.3.d:0 "4月27日深夜，墨索里尼在试图越过瑞士边境时被游击队抓获。据报道，墨索里尼和他的妻子被一并处决，他们的尸体正在米兰洛莱特广场上示众。\n\n这是否意味着法西斯主义在意大利的终结？"
scenarionews.3.a:0 "他的闹剧到此结束。"
scenarionews.4.t:0 "纳粹在鲁尔的失败"
scenarionews.4.d:0 "在经历了数周的激烈消耗战后，西线的B集团军群大部已在鲁尔包围圈内投降，就像当年斯大林格勒的红军对第六集团军做的一样。"
scenarionews.4.a:0 "有趣。"
scenarionews.4.b:0 "又是一场灾难！"
scenarionews.5.t:0 "马格德堡解放；奴隶集中营解放！"
scenarionews.5.d:0 "今天，美国军队刚刚解放了易北河东岸的马格德堡，此前在郊区发生了一系列重大战斗，随后在市中心发生了激烈交火，经过一个月的不间断战斗，残留的德国军队被彻底击退。 \n\n美国军队同时还在马格德堡发现了工业奴隶集中营，奴隶们目前已经得到解放。这是纳粹暴行的另一个罪证，活下来的人此刻正在哀悼已经逝去的人，地方官员正在筹备对此地的军事管理。"
scenarionews.5.a:0 "欧洲距黎明又近了一步。"
scenarionews.5.b:0 "最终时刻不远了！继续战斗！"
scenarionews.6.t:0 "意大利社会共和国的灭亡"
scenarionews.6.d:0 "随着盟军在意大利北部的推进，意大利社会共和国已经灭亡。 \n\n此地所有的德国和意大利军队已经放下武器，这将对德国无谓支撑造成致命一击。现在的问题仍然是盟军是否会继续保持他们的攻势。\n\n盟军的目光即将投向北方。"
scenarionews.6.a:0 "有趣。"
scenarionews.6.b:0 "叛徒！失败主义者！"  

### Decisions ###
GER_oberkommando:0 "国防军最高统帅部"
GER_oberkommando_desc:0 "在近两年战争里国防军不断的被击败。大德意志在各条战线上都输掉了，他高呼利用人民冲锋队与奇迹武器进行全面战争，并通过意志的力量取得最终胜利。然而，随着战场上盟军每天都在取得进展，苏联红军也在为最后的攻势做准备，胜利的希望已然十分渺茫。戈培尔关于最终胜利的演讲是否值得一观，还有待时日去观察。"
GER_hold_holland:0 "荷兰堡垒"
GER_hold_holland_desc:0 "大约15万名德国士兵将控制住荷兰，切断敌人的重要补给，并阻击盟军第12和第21集团军的增援部队。"
GER_hold_berlin:0 "守住柏林！"
GER_hold_berlin_desc:0 "来自前线的所有情报表明，红军将在不久的将来开始向柏林发动进攻。中央集团军和维斯瓦河集团军奉命保卫柏林，必须不惜一切代价守住柏林。 "
GER_hold_vienna:0 "维也纳攻势"
GER_hold_vienna_desc:0 "第二党卫装甲集团军第六党卫装甲军的任务是不顾一切地保卫维也纳。但他们缺乏燃油武器装备弹药，如果没有进一步的增援，这座城市注定会沦陷，但维也纳必须是我们的！"
GER_hold_stuttgart:0 "海尔布隆战役"
GER_hold_stuttgart_desc:0 "斯图加特以西的海尔布隆将在数小时内沦陷！阻止盟军控制海尔布隆将有效遏制他们向斯图加特和慕尼黑的推进，因此我们必须不惜一切代价守住它。"
GER_hold_italy:0 "葡萄弹行动"
GER_hold_italy_desc:0 "盟军在意大利发动了代号为“葡萄弹行动”的大规模攻势。阻止这场攻势对于遏制盟军最终攻占意大利和奥地利的目标至关重要。"
GER_hold_munich:0 "保卫慕尼黑！"
GER_hold_munich_desc:0 "慕尼黑城的废墟会为我们之后的重新集结和组织反击提供一次不容错过的良机。因此，慕尼黑绝不能落入敌人之手。"
GER_operation_hannibal:0 "汉尼拔行动"
GER_operation_hannibal_desc:0 "汉尼拔行动是一项从东普鲁士包围圈中通过海路疏散我们的军队与平民的行动，目前正在进行中。"
GER_ruhr_pocket:0 "鲁尔包围圈"
GER_ruhr_pocket_desc:0 "莫德尔元帅的B集团军群已在鲁尔地区被包围，B集团军群是我们西线军队的最后主力，所以它能否成功突围事关德国的成败。\n\n然而元首对B集团军群有其他的想法；他预计“鲁尔围攻”将持续数月，并会牵制数十万盟军的行动。"

