JAP_SEELOW_DESC:0 "После почти десятилетней войны некогда могущественная Империя Восходящего Солнца сталкивается с растущим давлением по мере того, как война все ближе подходит к материку. Флот империи превратился в руины, армии ослабли, а после высадки американского флота на Иводзиме, Окинаве и Филиппинах страна все больше и больше оказывается загнанной в угол. \Однако, если операция "Ити-Го" окажется успешной, смогут ли они закончить войну в Китае до того, как США достигнут Токио? Удастся ли им оттеснить американцев на Окинаву?"
