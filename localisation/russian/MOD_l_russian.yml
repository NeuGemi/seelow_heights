### Идеи ###
surrender_limit:0 "Endsieg"
GER_totalen_krieg_doctrine:0 "Тотальная война"
GER_shattered_wehrmacht:0 "Разбитый вермахт"
GER_shattered_wehrmacht_desc:0 "После 6 лет непрерывных боев вермахт окончательно встал на колени. Когда-то самая страшная армия мира превратилась в призрачный скелет самой себя. Командиры оказались за границей или за линией фронта, в Суде и на кенигсбергских косах... Для защиты последних сантиметров Фатерлянда используются разрозненные формирования. Это является своеобразным преимуществом, так как даже самые регулярные части не имеют элементарного снаряжения, необходимого для ведения масштабных боевых действий против наступающих с обеих сторон войск.\n\nНо не все потеряно, по мнению фюрера и министра пропаганды Йозефа Геббельса, который призывает к "Endsieg" или, иначе говоря, "Окончательной Победе" в войне. После смерти Франклина Д. Рузвельта Гитлер считает, что победа практически в руках..."
JAP_shattered_army:0 "Заходящее солнце"
JAP_economic_collapse:0 "Опустошение от бомбардировок"
GER_economic_collapse:0 "Бомбардировки союзников" 
GER_endsiegmod:0 "Endsieg"
GER_endsiegmod_tt:0 "\n§Если фюрер покончит жизнь самоубийством, война вряд ли будет продолжаться долго§!"
GER_scenariointro_tt:0 "§Опцию снятия дебаффов можно найти во вкладке "Решения"§!"
GER_scenario_volkssturm:0 "Фольксштурм"
GER_scenario_volkssturm_desc:0 "Фольксштурм" - это специальное вооруженное формирование гражданских лиц, созданное полномочным представителем "Тотальной войны" Йозефом Геббельсом. Он был жестким сторонником использования всех необходимых ресурсов страны, чтобы не дать большевистским ордам поглотить Германию целиком, и его стратегия была направлена на замедление продвижения советских войск... Будь то молодые, или старые, всеобщий призыв не оставлял бегущим от войны ни малейшего шанса на спасение. Эти формирования, как правило, плохо оснащены и, как следствие, не обучены. Их используют как корм для фронта, надеясь создать материальные условия для победы..."
GER_renewed_wehrmacht:0 "Вермахт"
GER_disloyalty:0 "Массовая нелояльность"
GER_disloyalty_desc:0 "Германия стоит на грани краха, поскольку солдаты отказываются от ведения боевых действий против союзников, а запад практически беззащитен, поскольку 15-я армия Моделя в Кельне распадается на части, и ходят слухи о мятеже командующего, который якобы готовит приказ отступить и сдаться. В связи с этим немецкие командиры по всему рейху отказались от приказов фюрера, что привело того в ярость. Гитлер впал в отчаяние, разглагольствуя о том, что "его предали окружающие" и что он сам виноват в завоевании Европы..."
GER_economic_collapse_tt:0 "§Y\nБудет убран, когда прогресс капитуляции станет ниже 1%§!"
SOV_berlin_strategic_offensive_operation:0 "Берлинская стратегическая наступательная операция"
RAJ_burmese_campaign:0 "Бирманская кампания (1944-1945)"
SOV_allied_control_commission:0 "Союзная контрольная комиссия"
acc_tt:0 "§Это государство находится под наблюдением Союзной контрольной комиссии§!"
operation_hannibal_tt:0 "§Операция "Ганнибал", эвакуация морским путем немецких войск и гражданского населения из Пруссии и Курляндского котла, в настоящее время продолжается§!"
the_united_nations:0 "Объединенные Нации"
CHI_endsiegmod:0 "Война Сопротивления"
GER_ag_c_surrender_tt:0 "§Все немецкие войска на территориях, контролируемых Италией, капитулировали§!"
ENG_europe_first_strat:0 "Стратегия "Европа прежде всего""

### События ###
intro.1.t:0 "Последние дни рейха"
intro.1.d:0 "Конец войны близок.\n\nОшеломляющий успех Висло-Одерской наступательной операции Красной Армии заложил основу для неизбежного штурма Берлина. Оборона Берлина теперь находится в руках разношерстных сил Гитлерюгенда, Фольксштурма и поредевшей 9-й армии.\n\nВ то же время на западе союзные войска продолжают продвигаться вглубь немецкой территории и сумели окружить группу армий "Б" Вальтера Моделя в самом центре промышленного региона Германии. Западный фронт теперь состоит из кампфгрупп и истощенных дивизий, многие из которых существуют только на бумаге."
intro.1.a:0 "Итак, все начинается..."
intro.2.t:0 "Заходящее солнце"
intro.2.d:0 "После почти десятилетней войны некогда могущественная Империя Восходящего Солнца сталкивается с растущим давлением по мере того, как война все ближе подходит к материку. Флот империи превратился в руины, армии ослабли, а после высадки американского флота на Иводзиме, Окинаве и Филиппинах страна все больше и больше оказывается загнанной в угол. \Однако, если операция "Ити-Го" окажется успешной, смогут ли они закончить войну в Китае до того, как США достигнут Токио? Удастся ли им оттеснить американцев на Окинаву?"
intro.2.a:0 "Итак, все начинается..."
scenario.1.t:0 "Heeresgruppe B капитулирует!"
scenario.1.d:0 "Фельдмаршал Вальтер Модель сообщил по радио о явной капитуляции окруженной Heeresgruppe B в Рурском кармане после двух недель фанатичных боев. Поступили первые сообщения о самоубийстве Моделя после этого поражения. \n\nМинистр пропаганды Йозеф Геббельс публично осудил Heeresgruppe B как предателей Рейха."
scenario.1.a:0 "Предатели!"
scenario.2.t:0 "Предательство Гиммлера"
scenario.2.d:0 "Коварный Генрих Гиммлер тайно пытался заключить сепаратный мир с союзными войсками! \n\nГиммлер в разгар хаоса организовал переговоры с графом Фольке Бернадоттом, используя в качестве посредника своего массажиста Феликса Керстена. После того как по приказу Гитлера Гиммлер был арестован, а переговоры провалились, он скрылся."
scenario.2.a:0 "Предательство!"
scenario.3.t:0 "Казнь Фегелейна"
scenario.3.d:0 "Дезертир Герман Фегелейн был обнаружен рейхсминистром Петером Хёглем в своей берлинской квартире, готовящимся бежать в Швецию после отказа участвовать в "пакте о самоубийстве", как он считает. После поимки Фегелейн был связан как соучастник предательства Гиммлера и срочно доставлен в рейхсбункер, где был приговорен к смертной казни."
scenario.3.a:0 "Фегелейн! Фегелейн! Фегелейн!"
scenario.4.t:0 "Фленсбургское правительство"
scenario.4.d:0 "В то время как союзные войска наступают по всем фронтам, адмирал Карл Дёниц после самоубийства Гитлера принимает на себя роль фюрера. На новое правительство, разместившееся во Фленсбурге, возлагается непосильная задача по управлению неоккупированными территориями рейха."
scenario.4.a:0 "Трехнедельный рейх."
scenario.5.t:0 "Адольф Гитлер совершает самоубийство!"
scenario.5.d:0 "Фюрер, $GER_adolf_hitler$, был найден мертвым в своем бункере. В условиях приближения вражеских войск фюрер, по-видимому, решил покончить с собой, не рискуя попасть в плен. Чтобы не допустить деморализации войск, нашим пропагандистам сообщают, что Гитлер погиб, героически сражаясь до последнего вздоха перед лицом превосходящих сил противника. После смерти фюрера его роль берет на себя Карл Дёниц."
scenario.5.a:0 "Война проиграна."
scenario.6.t:0 "Битва за замок Иттер"
scenario.6.d:0 "Пятого мая американские танковые батальоны начали атаку на замок Иттер. Французская звезда тенниса Боротра помог союзникам в атаке, взобравшись на стены замка и передав важную информацию о позициях противника. Этот день стал одним из самых странных сражений за всю войну и, несомненно, станет историей, о которой будут рассказывать еще не одно десятилетие."
scenario.6.a:0 "Трусы!"
scenario.7.t:0 "Пражское восстание"
scenario.7.d:0 "Тревожные вести о восстании в Праге дошли до уже развалившейся Heeresgruppe Ostmark. Сообщается, что чешские повстанцы уже захватили контроль над значительной частью города. \n\nПока что происходят лишь спорадические уличные бои между забаррикадировавшимися повстанцами и местными солдатами Ваффен-СС."
scenario.7.a:0 "Мы отвоюем то, что принадлежит нам."
scenario.8.t:0 "Геббельс совершает самоубийство!"
scenario.8.d:0 "В разгар ожесточенных уличных боев по всему Берлину министр пропаганды Йозеф Геббельс покончил жизнь самоубийством в бункере Фюрер, после смерти Гитлера. "
scenario.8.a:0 "Не имеет значения."
scenario.11.t:0 "Дезертиры"
scenario.11.d:0 "По 25-й армии ходят тревожные слухи. Armee о солдате, который выдает себя за гауптмана Люфтваффе, командует, отдает приказы и создает за собой нерегулярную группу солдат. \n\nНа его преступном пути были и разведывательные задания, и неудачные стычки, и необычная встреча с лагерем, где содержались брошенные солдаты вермахта."
scenario.11.a:0 "Дезертиры будут расстреляны!"

scenarionews.1.t:0 "Падение Вены"
scenarionews.1.d:0 "Город Вена, находившийся под контролем нацистов в течение последнего десятилетия, был освобожден советскими войсками. Это произошло после периода длительной осады города специальными формированиями для защиты от захвата Красной Армией. Это серьезный удар по нацистским военным усилиям, который, несомненно, еще больше подорвет их боевой дух, и Европа с трепетом ждет, что будет дальше..."
scenarionews.1.a:0 "Это крупная победа в антинацистских военных действиях и, несомненно, символизирует конец Германии."
scenarionews.1.b:0 "Endsieg еще впереди, мы не должны переживать из-за единичных поражений!"
scenarionews.2.t:0 "Битва за Берлин"
scenarionews.2.d:0 "На всем протяжении реки Одер-Нейсе объявлены ожесточенные бои, поскольку советские войска ведут последнее наступление с целью сокрушить Германию и захватить ее сердце - Берлин. \n\nСоветские войска начали массированные артиллерийские налеты по всей линии реки, в то время как сами немцы создали временную оборону и собрали все возможное, чтобы удержать Красную Армию. \n\nПо причине военного тумана известно не так много, но объявлены комбинированные атаки, а также крупные бои в районе Зееловских высот, где советские войска имеют плацдармы через реку Одер западнее Кюстрина."
scenarionews.2.a:0 "Мир в Европе близок, и мы молимся, чтобы Советы преуспели в своем наступлении."
scenarionews.2.b:0 "Пусть приходят."
scenarionews.3.t:0 "Муссолини схвачен и казнен"
scenarionews.3.d:0 "Поздним вечером 27 апреля Муссолини и его жена были захвачены партизанами при попытке пересечь швейцарскую границу. По сообщениям, Муссолини был убит, и его тело с триумфом выставлено на одной из площадей Милана. \n\nОзначает ли это конец фашизма в Италии?"
scenarionews.3.a:0 "Это конец его войны."
scenarionews.4.t:0 "Поражение нацистов в Руре"
scenarionews.4.d:0 "Основная часть немецких войск западного фронта, Heeresgruppe B, капитулировала в Рурском кармане - после нескольких недель ожесточенных боев на истощение, сродни окружению и разгрому немецкой армии в Сталинграде."
scenarionews.4.a:0 "Интересно."
scenarionews.4.b:0 "Это катастрофа!"
scenarionews.5.t:0 "Магдебург освобожден, промышленные лагеря рабов освобождены!"
scenarionews.5.d:0 "Сегодня американские войска освободили город Магдебург на правом берегу реки Эльбы после серии крупных боев в пригородах и тяжелых столкновений в центре города, где ничтожные немецкие силы после месяца непрерывных боев были отброшены. \n\nОстается только наблюдать ужасающие картины: американские войска обнаружили лагеря рабов промышленного уровня, многие из которых до сих пор активно освобождаются. Еще одно свидетельство нацистского зверства, освобожденные оплакивают погибших, а местные власти готовят военную администрацию."
scenarionews.5.a:0 "Европа еще на шаг приблизилась к миру."
scenarionews.5.b:0 "Конец не близок! Боритесь!"
scenarionews.6.t:0 "Падение Италии"
scenarionews.6.d:0 "Итальянская социальная республика пала в результате наступления союзных армий в Северной Италии. \n\nКапитуляция всех немецких и итальянских войск в Италии находится в стадии реализации и станет серьезным ударом по немецким военным силам. Теперь остается вопрос, удастся ли союзникам сохранить набранный темп. \n\nСейчас союзные войска смотрят на север."
scenarionews.6.a:0 "Интересно."
scenarionews.6.b:0 "Предатели, пораженцы!"  

### Решения ###
GER_oberkommando:0 "Oberkommando Des Heeres"
GER_oberkommando_desc:0 "После 6 лет войны вермахт терпит поражение, отступая. Германия проигрывает на всех фронтах, и Геббельс призывает к тотальной войне. Однако по мере того, как союзники с каждым днем отвоевывают позиции, а Красная Армия готовится к последнему наступлению, до победы остается все меньше времени. Остается только ждать, сбудутся ли речи Геббельса об окончательной победе."
GER_hold_holland:0 "Крепость Голландия"
GER_hold_holland_desc:0 "Около 150 000 немецких солдат обер-фельдфебеля Нидерланда призваны удерживать Нидерланды, отрезая противника от жизненно важных поставок, а также отвлекая подкрепления от союзных 12-й и 21-й групп армий."
GER_hold_berlin:0 "Удержать Берлин!"
GER_hold_berlin_desc:0 "Все разведданные с фронта говорят о том, что Красная Армия в ближайшее время начнет наступление на Берлин. Группа армий "Центр" и "Висла" получили приказ оборонять Берлин и должны удержать его любой ценой."
GER_hold_vienna:0 "Венское наступление"
GER_hold_vienna_desc:0 "II SS. Panzerkorps 6. SS Panzerarmee поручено отчаянно оборонять Вену. Им не хватает техники, а без нее город обречен на падение без каких-либо подкреплений. Вена должна остаться за нами!"
GER_hold_stuttgart:0 "Битва за Хайльбронн"
GER_hold_stuttgart_desc:0 "Хайльбронн, расположенный к западу от Штутгарта, должен пасть в течение нескольких часов! Устранение Хайльбронна из-под контроля союзников замедлит их продвижение на Штутгарт и Мюнхен, поэтому его необходимо удержать любой ценой."
GER_hold_italy:0 "Операция "Grapeshot""
GER_hold_italy_desc:0 "Союзники начали последнее наступление в Италии под кодовым названием "Операция "Грейпшот." Остановка этого наступления имеет первостепенное значение для прекращения возможного продвижения союзников в Австрию и Италию."
GER_hold_munich:0 "Защитить Мюнхен!"
GER_hold_munich_desc:0 "Развалины города Мюнхена представляют собой отличную резервную линию для перегруппировки и организации контратаки. По этой причине Мюнхен не должен попасть в руки врага."
GER_operation_hannibal:0 "Операция "Ганнибал""
GER_operation_hannibal_desc:0 "В настоящее время проводится операция "Ганнибал" - эвакуация морем немецких войск и гражданского населения из Пруссии и Курляндского котла."

JAP_hold_territory:0 "Главное командование обороны"
JAP_hold_burma:0 "Удерживать Бирму"
JAP_hold_phi:0 "Удерживать Филиппины"
JAP_hold_okinawa:0 "Удерживать Окинаву"

scenario_settings:0 "Настройки сценария"
GER_scenario_settings:0 "Убрать все модификаторы"
