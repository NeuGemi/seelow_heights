GER_SEELOW_DESC:0 "От Германии остались одни руины, на смену некогда могучей немецкой армии пришли неопытные молодые и просто пожилые люди. Германия стоит на коленях перед союзниками, наступающими на Эльбу с запада, а советские войска готовятся к финальной атаке с востока, и Вена уже в их руках. Гитлер бушует и неистовствует в ожидании победы, которую он все еще так надеется одержать."
